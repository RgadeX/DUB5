<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DUB5</title>
    <meta name="description" content="DUB5 — games, tools en leermateriaal op één plek." />
    <meta name="theme-color" content="#0b1150" />
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DR2WXMGWR6"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DR2WXMGWR6');
    </script>
    <style>
      :root {
        --nav-hover-transition-duration: 300ms;
        --nav-hover-transition-timing: ease-in-out;

        --line: rgba(224, 242, 254, 0.16);
        --line-strong: rgba(224, 242, 254, 0.3);

        --ink: rgb(226, 240, 255);
        --ink-dim: rgba(226, 240, 255, 0.6);

        --glass: rgba(9, 13, 38, 0.62);
        --glass-hover: rgba(13, 19, 50, 0.72);
        --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.09);
        --glass-shadow: 0 18px 40px -26px rgba(0, 0, 0, 1);
        --glass-blur: blur(16px) saturate(160%);

        --card-radius: 999px;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      html {
        -webkit-text-size-adjust: 100%;
        scroll-behavior: smooth;
        scroll-padding-top: 110px;
      }

      body {
        min-height: 100vh;
        background: radial-gradient(140% 100% at 50% -10%, #0b1150 0%, #050833 42%, #01030f 100%);
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow-x: hidden;
        position: relative;
        -webkit-font-smoothing: antialiased;
        /* Footer stays at the bottom of the page */
        display: flex;
        flex-direction: column;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -15%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(42% 34% at 16% 10%, rgba(70, 110, 255, 0.20), transparent 68%),
          radial-gradient(38% 30% at 86% 16%, rgba(150, 80, 255, 0.15), transparent 66%),
          radial-gradient(58% 42% at 52% 108%, rgba(0, 130, 230, 0.18), transparent 72%);
        filter: blur(26px);
      }

      .stars {
        position: fixed;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        display: block;
      }

      /* =========================================================
         TOPBAR
         ========================================================= */
      .topbar {
        position: fixed;
        top: 0; left: 0; right: 0;
        z-index: 40;
      }
      .topbar::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        background: rgba(6, 9, 28, 0.55);
        backdrop-filter: blur(18px) saturate(170%);
        -webkit-backdrop-filter: blur(18px) saturate(170%);
        border-bottom: 1px solid rgba(224, 242, 254, 0.12);
        box-shadow: 0 24px 50px -40px rgba(0, 0, 0, 1);
        transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .topbar.is-scrolled::before { opacity: 1; }

      .topbar-inner {
        position: relative;
        z-index: 1;
        max-width: 1280px;
        margin: 0 auto;
        padding: 0.95rem 1.5rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        transition: padding 420ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      .topbar.is-scrolled .topbar-inner {
        padding-top: 0.55rem;
        padding-bottom: 0.55rem;
      }

      .topbar-brand {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        text-decoration: none;
        color: #fff;
        font-family: 'DM Serif Display', serif;
        font-size: 1.05rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        flex-shrink: 0;
      }

      .brand-mark {
        position: relative;
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }
      .brand-canvas {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 72px;
        height: 72px;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: block;
      }

      /* --- Topbar links: plain text only, no pill, white on hover --- */
      .topbar-links {
        display: flex;
        align-items: center;
        gap: 0.15rem;
        overflow-x: auto;
        scrollbar-width: none;
        -ms-overflow-style: none;
        margin-left: auto;
      }
      .topbar-links::-webkit-scrollbar { display: none; }

      .topbar-link {
        flex-shrink: 0;
        text-decoration: none;
        font-size: 0.86rem;
        font-weight: 600;
        color: var(--ink-dim);
        padding: 0.5rem 0.85rem;
        border: none;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
        transition: color 300ms ease;
      }
      .topbar-link:hover,
      .topbar-link:focus-visible {
        color: #fff;
        outline: none;
        background: transparent;
      }

      /* --- Layout toggle button (icon only) --- */
      .layout-btn {
        flex-shrink: 0;
        appearance: none;
        border: none;
        background: transparent;
        color: var(--ink-dim);
        width: 32px;
        height: 32px;
        padding: 0;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: color 200ms ease, transform 200ms ease;
        margin-left: 0.35rem;
      }
      .layout-btn:hover,
      .layout-btn:focus-visible {
        color: #fff;
        outline: none;
      }
      .layout-btn:active { transform: scale(0.9); }
      .layout-btn svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      /* =========================================================
         LAYOUT
         ========================================================= */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 7.5rem 2rem 3rem;
        position: relative;
        z-index: 10;
        flex: 1 1 auto;
        width: 100%;
      }

      /* ---------- Header ---------- */
      .header {
        text-align: center;
        margin-bottom: 3rem;
      }

      .title-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.28em;
        font-size: 8rem;
        line-height: 1;
        font-family: 'DM Serif Display', serif;
      }

      .title-wrap h1 {
        font-size: 1em;
        line-height: 1;
        font-weight: normal;
        color: #fff;
        letter-spacing: 0.01em;
        text-shadow: 0 0 60px rgba(120, 170, 255, 0.28);
        opacity: 0;
        animation: fade-in 700ms ease-out 80ms forwards;
      }

      .logo-slot {
        position: relative;
        width: 0.42em;
        height: 0.42em;
        flex-shrink: 0;
        display: grid;
        place-items: center;
      }

      .logo-canvas {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 2.2em;
        height: 2.2em;
        transform: translate(-50%, -50%);
        pointer-events: none;
        display: block;
      }

      .rating-stars {
        font-size: 1.9rem;
        letter-spacing: 0.28em;
        margin: 1.15rem 0 0.9rem;
        color: rgba(226, 240, 255, 0.9);
        text-shadow: 0 0 22px rgba(160, 200, 255, 0.45);
        opacity: 0;
        animation: fade-in 700ms ease-out 260ms forwards;
      }

      .header .subline {
        font-size: 1rem;
        color: var(--ink-dim);
        opacity: 0;
        animation: fade-in 700ms ease-out 340ms forwards;
      }

      /* Header rule: expands smoothly from the center outward, both sides */
      .header-rule {
        height: 1px;
        max-width: 1280px;
        margin: 2.25rem auto 0;
        transform: scaleX(0);
        transform-origin: center center;
        background: linear-gradient(
          90deg,
          rgba(190, 215, 255, 0) 0%,
          rgba(190, 215, 255, 0.35) 12%,
          rgba(214, 232, 255, 0.72) 50%,
          rgba(190, 215, 255, 0.35) 88%,
          rgba(190, 215, 255, 0) 100%
        );
        opacity: 0.75;
        animation: rule-in 1300ms cubic-bezier(0.22, 1, 0.36, 1) 300ms forwards;
      }
      @keyframes rule-in {
        to { transform: scaleX(1); }
      }

      /* =========================================================
         VIEW SWITCH  (NOT sticky — just normal flow)
         ========================================================= */
      .switch-bar {
        display: flex;
        justify-content: center;
        margin-bottom: 2.5rem;
      }

      .view-switch {
        position: relative;
        display: inline-flex;
        padding: 4px;
        border-radius: 999px;
        background: var(--glass);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-inset), var(--glass-shadow);
      }

      .switch-thumb {
        position: absolute;
        top: 4px;
        left: 4px;
        height: calc(100% - 8px);
        width: 0;
        border-radius: 999px;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.17), rgba(255, 255, 255, 0.06));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 8px 20px -12px rgba(0, 0, 0, 1);
        transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                    width 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        pointer-events: none;
      }

      .view-switch button {
        position: relative;
        z-index: 2;
        appearance: none;
        border: 0;
        background: none;
        cursor: pointer;
        padding: 0.55rem 1.4rem;
        border-radius: 999px;
        font: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: var(--ink-dim);
        transition: color 0.3s ease;
        white-space: nowrap;
      }
      .view-switch button:hover { color: rgba(255, 255, 255, 0.85); }
      .view-switch button.is-active { color: #fff; }
      .view-switch button:focus-visible {
        outline: 2px solid rgba(150, 190, 255, 0.85);
        outline-offset: 3px;
      }

      /* =========================================================
         SHOWCASE BUTTON (BIG NEW BUTTON)
         ========================================================= */
      .showcase-promo {
        margin: 2.5rem auto 0;
        max-width: 1280px;
        text-align: center;
      }

      .showcase-button {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 1.25rem 2.5rem;
        border-radius: 999px;
        border: 2px solid rgba(255, 100, 150, 0.5);
        background: linear-gradient(135deg, rgba(255, 80, 120, 0.25), rgba(200, 50, 100, 0.35));
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        box-shadow:
          0 0 40px rgba(255, 80, 120, 0.4),
          0 0 80px rgba(255, 80, 120, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.15),
          0 8px 32px rgba(0, 0, 0, 0.3);
        color: #fff;
        font-family: 'DM Serif Display', serif;
        font-size: 1.4rem;
        font-weight: normal;
        letter-spacing: 0.05em;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        animation: showcase-pulse 2s ease-in-out infinite;
      }

      .showcase-button::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 999px;
        background: linear-gradient(135deg, rgba(255, 100, 150, 0.6), rgba(255, 80, 120, 0.4), rgba(200, 50, 100, 0.6));
        z-index: -1;
        filter: blur(12px);
        opacity: 0.5;
        transition: opacity 0.4s ease;
      }

      .showcase-button:hover {
        transform: translateY(-4px) scale(1.05);
        border-color: rgba(255, 120, 160, 0.7);
        background: linear-gradient(135deg, rgba(255, 100, 140, 0.35), rgba(220, 60, 110, 0.45));
        box-shadow:
          0 0 60px rgba(255, 100, 150, 0.6),
          0 0 100px rgba(255, 80, 120, 0.3),
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          0 12px 40px rgba(0, 0, 0, 0.4);
      }

      .showcase-button:hover::before {
        opacity: 0.8;
      }

      .showcase-button:active {
        transform: translateY(-2px) scale(1.02);
      }

      .showcase-button:focus-visible {
        outline: 3px solid rgba(255, 150, 180, 0.8);
        outline-offset: 4px;
      }

      .showcase-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.35rem 0.85rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff4080, #ff2060);
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        box-shadow: 0 0 20px rgba(255, 64, 128, 0.6);
        animation: badge-glow 1.5s ease-in-out infinite alternate;
      }

      @keyframes showcase-pulse {
        0%, 100% {
          box-shadow:
            0 0 40px rgba(255, 80, 120, 0.4),
            0 0 80px rgba(255, 80, 120, 0.2),
            inset 0 1px 0 rgba(255, 255, 255, 0.15),
            0 8px 32px rgba(0, 0, 0, 0.3);
        }
        50% {
          box-shadow:
            0 0 50px rgba(255, 100, 150, 0.5),
            0 0 90px rgba(255, 80, 120, 0.3),
            inset 0 1px 0 rgba(255, 255, 255, 0.2),
            0 8px 32px rgba(0, 0, 0, 0.3);
        }
      }

      @keyframes badge-glow {
        0% {
          box-shadow: 0 0 15px rgba(255, 64, 128, 0.5);
        }
        100% {
          box-shadow: 0 0 25px rgba(255, 64, 128, 0.8);
        }
      }

      @media (max-width: 768px) {
        .showcase-button {
          padding: 1rem 2rem;
          font-size: 1.15rem;
        }
        .showcase-badge {
          padding: 0.3rem 0.7rem;
          font-size: 0.7rem;
        }
      }

      /* =========================================================
         GRID + CARDS
         ========================================================= */
      .nav-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 0.85rem;
        max-width: 1280px;
        margin: 0 auto;
      }
      
      .nav-grid.compact {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      }

      .nav-button {
        position: relative;
        display: flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.68rem 1.15rem 0.68rem 0.68rem;
        border-radius: var(--card-radius);
        border: 1px solid var(--line);
        background: var(--glass);
        backdrop-filter: var(--glass-blur);
        -webkit-backdrop-filter: var(--glass-blur);
        box-shadow: var(--glass-inset), var(--glass-shadow);
        text-decoration: none;
        color: inherit;
        transition: border-color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
                    transform var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
                    background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
        animation: card-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) backwards;
        animation-delay: calc(var(--i, 0) * 20ms);
      }
      .nav-button:hover,
      .nav-button:focus-visible {
        border-color: var(--line-strong);
        transform: translateY(-2px);
        background: var(--glass-hover);
      }
      .nav-button:focus-visible {
        outline: 2px solid rgba(224, 242, 254, 0.8);
        outline-offset: 3px;
      }

      .nav-button-glow {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        opacity: 0;
        transition: opacity var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
        pointer-events: none;
      }
      .nav-button:hover .nav-button-glow { opacity: 1; }

      .icon-chip {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: var(--accent, #9ec5ff);
        background: var(--accent-soft, rgba(158, 197, 255, 0.13));
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.13);
        transition: transform 0.3s ease;
      }
      .nav-button:hover .icon-chip { transform: scale(1.05); }
      .icon-chip svg { width: 20px; height: 20px; }

      /* Titles: never shrink, never ellipsize — full name always shown */
      .nav-button-title {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        font-size: 0.98rem;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
        color: rgba(255, 255, 255, 0.95);
        transition: transform 0.3s ease;
      }
      .nav-button:hover .nav-button-title { transform: translateX(2px); }

      .nav-button-desc {
        position: relative;
        z-index: 2;
        flex: 1 1 auto;
        min-width: 0;
        font-size: 0.83rem;
        color: var(--ink-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      
      .nav-grid.compact .nav-button-desc {
        display: none;
      }
      
      .nav-grid.compact .nav-button-title {
        flex: 1 1 auto;
      }

      .badge {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        padding: 0.22rem 0.5rem;
        border-radius: 7px;
        color: #fff;
        background: linear-gradient(180deg, #ff5a5f 0%, #d81f2a 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 6px 18px -8px rgba(216, 31, 42, 0.95);
      }

      .card-arrow {
        position: relative;
        z-index: 2;
        width: 1rem;
        height: 1rem;
        flex: 0 0 auto;
        margin-left: auto;
        color: var(--ink-dim);
        transition: transform 0.3s ease, color 0.3s ease;
      }
      .nav-button:hover .card-arrow {
        transform: translate(2px, -2px);
        color: #fff;
      }

      [data-cat="games"]  { --accent: #4cc9f0; --accent-soft: rgba(76, 201, 240, 0.13); }
      [data-cat="tools"]  { --accent: #a78bfa; --accent-soft: rgba(167, 139, 250, 0.13); }
      [data-cat="study"]  { --accent: #34d399; --accent-soft: rgba(52, 211, 153, 0.13); }
      [data-cat="hacks"]  { --accent: #fb7185; --accent-soft: rgba(251, 113, 133, 0.13); }
      [data-cat="guides"] { --accent: #fbbf24; --accent-soft: rgba(251, 191, 36, 0.13); }

      /* =========================================================
         LAYOUT VARIATIONS  (data-layout on <body>)
         ========================================================= */
      /* pill (default) — everything as-is */

      /* full — wider cards so long names never feel tight */
      body[data-layout="full"] .nav-grid {
        grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      }
      body[data-layout="full"] .nav-button-desc { display: none; }

      /* wide — extra horizontal space */
      body[data-layout="wide"] .nav-grid {
        grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
      }

      /* tall — icon + name + description stacked vertically */
      body[data-layout="tall"] .nav-grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
      body[data-layout="tall"] .nav-button {
        flex-direction: column;
        align-items: flex-start;
        padding: 1.1rem 1.1rem 1rem;
        border-radius: 18px;
        gap: 0.5rem;
      }
      body[data-layout="tall"] .nav-button-title {
        white-space: normal;
        font-size: 1.05rem;
      }
      body[data-layout="tall"] .nav-button-desc {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        font-size: 0.86rem;
        line-height: 1.5;
      }
      body[data-layout="tall"] .card-arrow {
        position: absolute;
        top: 1.1rem;
        right: 1.1rem;
      }
      body[data-layout="tall"] .badge {
        position: absolute;
        top: 1.1rem;
        right: 2.6rem;
      }

      /* compact — small cards, icon + name only */
      body[data-layout="compact"] .nav-grid {
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      }
      body[data-layout="compact"] .nav-button-desc { display: none; }
      body[data-layout="compact"] .nav-button { padding: 0.55rem 0.9rem 0.55rem 0.55rem; }

      /* list — full-width rows, everything on one line */
      body[data-layout="list"] .nav-grid {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      body[data-layout="list"] .nav-button { width: 100%; }
      body[data-layout="list"] .nav-button-desc { flex: 1 1 auto; }

      /* three-columns — 3 columns without descriptions (default) */
      body[data-layout="three-columns"] .nav-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      body[data-layout="three-columns"] .nav-button-desc { display: none; }

      @media (max-width: 900px) {
        body[data-layout="three-columns"] .nav-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        body[data-layout="three-columns"] .nav-grid {
          grid-template-columns: 1fr;
        }
      }

      /* =========================================================
         SECTIONS
         ========================================================= */
      .cat-section { scroll-margin-top: 110px; }
      .cat-section + .cat-section { margin-top: 3rem; }

      .section-separator {
        height: 1px;
        max-width: 1280px;
        margin: 2.5rem auto;
        background: linear-gradient(
          90deg,
          rgba(190, 215, 255, 0) 0%,
          rgba(190, 215, 255, 0.25) 12%,
          rgba(214, 232, 255, 0.5) 50%,
          rgba(190, 215, 255, 0.25) 88%,
          rgba(190, 215, 255, 0) 100%
        );
        opacity: 0.6;
      }

      .section-head {
        max-width: 1280px;
        margin: 0 auto 1.1rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      /* =========================================================
         STAR RENDERER
         Classic Flare + faint halo. Speed 0.60, scale 0.60.
         Drawn entirely with live canvas gradients → sharp at any DPR.
         ========================================================= */
      function setupStar(canvas, glowRadius) {
        if (!canvas) return;
        const ctx = canvas.getContext('2d', { alpha: true });
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        /* How much bigger the flare is than the glow — 6× is the classic ratio,
           plus a 1.5× safety margin so the flare tips never clip. */
        const FLARE_RATIO = 6;
        const SAFETY = 1.5;
        const canvasSize = glowRadius * FLARE_RATIO * SAFETY;

        const SPEED = 0.60;             // animation speed (twinkle + rotation)
        const SCALE = 0.60;             // size multiplier
        const TWINKLE_BASE = 1.10;      // base twinkle rate
        const ROTATION_BASE = 0.005;    // base rotation per frame

        let dpr = Math.min(window.devicePixelRatio || 1, 3);
        let angle = 0;
        let phase = Math.random() * Math.PI * 2;
        let rafId = null;
        let startT = performance.now();

        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 3);
          canvas.width  = Math.round(canvasSize * dpr);
          canvas.height = Math.round(canvasSize * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function drawFrame(now) {
          const t = (now - startT) / 1000;
          const cx = canvasSize / 2;
          const cy = canvasSize / 2;

          const twinkle = 0.7 + 0.3 * Math.sin(t * TWINKLE_BASE * SPEED + phase);
          const alpha = Math.min(1, 0.92 * twinkle);

          const r = glowRadius * SCALE;
          const flareSize = r * FLARE_RATIO;

          ctx.clearRect(0, 0, canvasSize, canvasSize);
          ctx.save();
          ctx.translate(cx, cy);

          /* 1. Faint halo — very subtle, pale blue */
          const haloRad = r * 2.8;
          const haloGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, haloRad);
          haloGrad.addColorStop(0.00, 'rgba(235, 245, 255, 0.16)');
          haloGrad.addColorStop(0.38, 'rgba(210, 228, 255, 0.05)');
          haloGrad.addColorStop(0.72, 'rgba(190, 215, 255, 0.02)');
          haloGrad.addColorStop(1.00, 'rgba(180, 210, 255, 0)');
          ctx.globalAlpha = alpha;
          ctx.fillStyle = haloGrad;
          ctx.beginPath();
          ctx.arc(0, 0, haloRad, 0, Math.PI * 2);
          ctx.fill();

          /* 2. Soft glow */
          const glowGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
          glowGrad.addColorStop(0.00, 'rgba(255, 255, 255, 1)');
          glowGrad.addColorStop(0.14, 'rgba(255, 255, 255, 0.80)');
          glowGrad.addColorStop(0.38, 'rgba(255, 255, 255, 0.20)');
          glowGrad.addColorStop(0.72, 'rgba(255, 255, 255, 0.04)');
          glowGrad.addColorStop(1.00, 'rgba(255, 255, 255, 0)');
          ctx.globalAlpha = alpha;
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fill();

          /* 3. Bright white core */
          ctx.globalAlpha = alpha;
          ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
          ctx.beginPath();
          ctx.arc(0, 0, Math.max(0.6, r * 0.15), 0, Math.PI * 2);
          ctx.fill();

          /* 4. Classic 4-point cross flare, rotating slowly */
          ctx.globalAlpha = alpha * 0.30;
          ctx.save();
          ctx.rotate(angle);
          const half = flareSize / 2;
          const thickness = Math.max(1.5, flareSize * 0.017);

          const hGrad = ctx.createLinearGradient(-half, 0, half, 0);
          hGrad.addColorStop(0,   'rgba(255, 255, 255, 0)');
          hGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.85)');
          hGrad.addColorStop(1,   'rgba(255, 255, 255, 0)');
          ctx.fillStyle = hGrad;
          ctx.fillRect(-half, -thickness / 2, flareSize, thickness);

          const vGrad = ctx.createLinearGradient(0, -half, 0, half);
          vGrad.addColorStop(0,   'rgba(255, 255, 255, 0)');
          vGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.85)');
          vGrad.addColorStop(1,   'rgba(255, 255, 255, 0)');
          ctx.fillStyle = vGrad;
          ctx.fillRect(-thickness / 2, -half, thickness, flareSize);

          ctx.restore();
          ctx.restore();

          if (!reduceMotion) angle += ROTATION_BASE * SPEED;
          rafId = requestAnimationFrame(drawFrame);
        }

        function start() {
          if (rafId !== null) cancelAnimationFrame(rafId);
          if (reduceMotion) {
            drawFrame(startT); // one static frame
            if (rafId !== null) cancelAnimationFrame(rafId);
            rafId = null;
            return;
          }
          rafId = requestAnimationFrame(drawFrame);
        }

        resize();
        start();

        /* Rebuild on resize (debounced) */
        let resizeTimer = null;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => { resize(); start(); }, 120);
        });

        document.addEventListener('visibilitychange', () => {
          if (reduceMotion) return;
          if (document.hidden) {
            if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
          } else {
            start();
          }
        });
      }

      /* =========================================================
         RENDER
         ========================================================= */
      const content = document.getElementById('content');
      const viewSwitch = document.getElementById('viewSwitch');
      const switchThumb = document.getElementById('switchThumb');
      let currentView = 'all';

      function cardHTML(item, index) {
        const arrow = item.external ? ARROW_EXTERNAL : ARROW_INLINE;
        const target = item.external ? ' target="_blank" rel="noopener noreferrer"' : '';
        const badge = item.badge ? '<span class="badge">' + item.badge + '</span>' : '';

        // Use image if provided, otherwise fall back to icon
        let iconContent;
        if (item.image) {
          iconContent = '<img src="' + item.image + '" alt="" width="40" height="40" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />';
        } else {
          iconContent = ICONS[item.icon] || '';
        }

        return '<a class="nav-button" data-cat="' + item.cat + '" href="' + item.href + '"' + target +
          ' style="--i:' + index + '">' +
            '<span class="nav-button-glow"></span>' +
            '<span class="icon-chip">' + iconContent + '</span>' +
            '<span class="nav-button-title">' + item.title + '</span>' +
            '<span class="nav-button-desc">' + item.desc + '</span>' +
            badge +
            arrow +
          '</a>';
      }

      // Items flagged localOnly (e.g. gallery) only render on localhost —
      // they are excluded from the Vercel deployment.
      const IS_LOCAL_HOST = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
      const VISIBLE_ITEMS = ITEMS.filter(function (item) { return !item.localOnly || IS_LOCAL_HOST; });

      function render(view) {
        currentView = view;

        if (view === 'all') {
          // Split games into DUB5-made and linked
          const games = VISIBLE_ITEMS.filter(function (item) { return item.cat === 'games'; });
          const dub5Games = games.filter(function (item) { return item.type === 'dub5'; });
          const linkedGames = games.filter(function (item) { return item.type === 'linked'; });
          const otherItems = VISIBLE_ITEMS.filter(function (item) { return item.cat !== 'games'; });

          let html = '';
          let index = 0;

          // Linked games section (original games) - displayed first
          if (linkedGames.length > 0) {
            html += '<div class="nav-grid">' +
              linkedGames.map(function (item) { return cardHTML(item, index++); }).join('') +
              '</div>';
          }

          // Separator line
          if (linkedGames.length > 0 && dub5Games.length > 0) {
            html += '<div class="section-separator"></div>';
          }

          // DUB5-made games section
          if (dub5Games.length > 0) {
            html += '<div class="nav-grid">' +
              dub5Games.map(function (item) { return cardHTML(item, index++); }).join('') +
              '</div>';
          }

          // Other items (tools, gallery, etc.)
          if (otherItems.length > 0) {
            if (games.length > 0) {
              html += '<div class="section-separator"></div>';
            }
            html += '<div class="nav-grid">' +
              otherItems.map(function (item) { return cardHTML(item, index++); }).join('') +
              '</div>';
          }

          content.innerHTML = html;
        } else {
          content.innerHTML = CATEGORIES.map(function (cat) {
            const items = VISIBLE_ITEMS.filter(function (item) { return item.cat === cat.id; });
            if (!items.length) return '';

            // For games category, split into DUB5-made and linked with labels
            if (cat.id === 'games') {
              const dub5Games = items.filter(function (item) { return item.type === 'dub5'; });
              const linkedGames = items.filter(function (item) { return item.type === 'linked'; });

              let html = '<section class="cat-section" data-cat="' + cat.id + '" id="' + cat.id + '">';
              let index = 0;

              if (dub5Games.length > 0) {
                html += '<div class="section-head">' +
                  '<h3>DUB5 Games</h3>' +
                  '<span class="section-count">' + dub5Games.length + '</span>' +
                '</div>' +
                '<div class="nav-grid">' +
                  dub5Games.map(function (item) { return cardHTML(item, index++); }).join('') +
                '</div>';
              }

              if (linkedGames.length > 0) {
                html += '<div class="section-head" style="margin-top: 3rem;">' +
                  '<h3>Originele Games</h3>' +
                  '<span class="section-count">' + linkedGames.length + '</span>' +
                '</div>' +
                '<div class="nav-grid">' +
                  linkedGames.map(function (item) { return cardHTML(item, index++); }).join('') +
                '</div>';
              }

              html += '</section>';
              return html;
            }

            // Other categories (tools, gallery) - normal rendering
            return '<section class="cat-section" data-cat="' + cat.id + '" id="' + cat.id + '">' +
              '<div class="section-head">' +
                '<h3>' + cat.label + '</h3>' +
                '<span class="section-count">' + items.length + '</span>' +
              '</div>' +
              '<div class="nav-grid">' +
                items.map(function (item, i) { return cardHTML(item, i); }).join('') +
              '</div>' +
            '</section>';
          }).join('');
        }

        bindCardGlow();
        positionThumb();
      }

      function bindCardGlow() {
        document.querySelectorAll('.nav-button').forEach(function (button) {
          const glow = button.querySelector('.nav-button-glow');
          if (!glow) return;

          button.addEventListener('mousemove', function (e) {
            const rect = button.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            glow.style.background =
              'radial-gradient(circle at ' + x + 'px ' + y + 'px, rgba(255,255,255,0.16) 0%, transparent 60%)';
          });

          button.addEventListener('mouseleave', function () {
            glow.style.background = '';
          });
        });
      }

      /* =========================================================
         VIEW SWITCH
         ========================================================= */
      function positionThumb() {
        if (!switchThumb) return;
        const active = viewSwitch.querySelector('button.is-active');
        if (!active) return;

        const wrapRect = viewSwitch.getBoundingClientRect();
        const btnRect = active.getBoundingClientRect();

        switchThumb.style.width = btnRect.width + 'px';
        switchThumb.style.transform = 'translateX(' + (btnRect.left - wrapRect.left - 4) + 'px)';
      }

      function setView(view) {
        if (view === currentView) return;

        viewSwitch.dataset.active = view;
        viewSwitch.querySelectorAll('button').forEach(function (btn) {
          const active = btn.dataset.view === view;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-pressed', String(active));
        });

        render(view);
      }

      viewSwitch.querySelectorAll('button').forEach(function (btn) {
        btn.addEventListener('click', function () { setView(btn.dataset.view); });
      });

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'c' && e.key !== 'C') return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;

        const t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;

        setView(currentView === 'all' ? 'sections' : 'all');
      });

      window.addEventListener('resize', positionThumb);

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(positionThumb);
      }

      render('all');
      requestAnimationFrame(positionThumb);

      /* =========================================================
         LAYOUT TOGGLE
         ========================================================= */
      const LAYOUTS = [
        { id: 'four-columns', label: '4 kolommen', desc: false },
        { id: 'three-columns-with-desc', label: '3 kolommen met beschrijving', desc: true }
      ];
      let layoutIndex = 0;
      const layoutBtn = document.getElementById('layoutBtn');

      function applyLayout(id, label, showDesc) {
        const navGrids = document.querySelectorAll('.nav-grid');

        if (id === 'four-columns') {
          navGrids.forEach(navGrid => {
            navGrid.style.gridTemplateColumns = 'repeat(4, 1fr)';
          });
          document.querySelectorAll('.nav-button-desc').forEach(el => el.style.display = 'none');
        } else if (id === 'three-columns-with-desc') {
          navGrids.forEach(navGrid => {
            navGrid.style.gridTemplateColumns = 'repeat(3, 1fr)';
          });
          document.querySelectorAll('.nav-button-desc').forEach(el => el.style.display = '');
        }

        layoutBtn.title = 'Layout: ' + label;
        layoutBtn.setAttribute('aria-label', 'Layout: ' + label);
      }

      layoutBtn.addEventListener('click', function () {
        layoutIndex = (layoutIndex + 1) % LAYOUTS.length;
        const L = LAYOUTS[layoutIndex];
        applyLayout(L.id, L.label, L.desc);
      });

      // Apply default layout on load (3 columns without descriptions)
      const navGrids = document.querySelectorAll('.nav-grid');
      navGrids.forEach(navGrid => {
        navGrid.style.gridTemplateColumns = 'repeat(3, 1fr)';
      });
      document.querySelectorAll('.nav-button-desc').forEach(el => el.style.display = 'none');

      /* =========================================================
         TOPBAR
         ========================================================= */
      (function topbar() {
        const bar = document.getElementById('topbar');
        const brand = document.querySelector('.topbar-brand');
        if (!bar) return;

        // Scroll to top on page load/refresh
        window.addEventListener('load', function() {
          window.scrollTo(0, 0);
        });
        
        // Hide brand on game pages (not landing page)
        if (window.location.pathname !== '/' && window.location.pathname !== '/index.html') {
          if (brand) brand.style.display = 'none';
        }
        
        let ticking = false;
        function update() {
          const y = window.scrollY || window.pageYOffset || 0;
          bar.classList.toggle('is-scrolled', y > 24);
          ticking = false;
        }
        window.addEventListener('scroll', function () {
          if (!ticking) {
            ticking = true;
            requestAnimationFrame(update);
          }
        }, { passive: true });
        update();
      })();

      document.querySelectorAll('[data-nav]').forEach(function (link) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          const cat = link.dataset.nav;

          if (currentView !== 'sections') setView('sections');

          requestAnimationFrame(function () {
            const el = document.querySelector('.cat-section[data-cat="' + cat + '"]');
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });
      });

      /* =========================================================
         STARFIELD
         ========================================================= */
      (function starfield() {
        const canvas = document.getElementById('stars');
        if (!canvas) return;

        const ctx = canvas.getContext('2d', { alpha: true });
        const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const TINTS = [
          [255, 255, 255],
          [205, 222, 255],
          [255, 236, 214],
          [186, 205, 255]
        ];

        const BASE_SIZE = [1.8, 3.2, 6.4, 11];
        const spriteCache = new Map();
        let flareSprite = null;

        let W = 0, H = 0, dpr = 1;
        let stars = [];
        let shooting = null;
        let nextShot = 3200;
        let mouseX = 0, mouseY = 0;
        let targetX = 0, targetY = 0;
        let lastT = performance.now();
        let rafId = null;

        function getSprite(tint, bucket) {
          const key = tint + ':' + bucket;
          const cached = spriteCache.get(key);
          if (cached) return cached;

          const radius = [1.5, 2.6, 4.6, 7.4][bucket];
          const size = Math.max(2, Math.ceil(radius * 2));
          const c = document.createElement('canvas');
          c.width = size;
          c.height = size;

          const g = c.getContext('2d');
          const t = TINTS[tint];
          const cx = size / 2;

          const grad = g.createRadialGradient(cx, cx, 0, cx, cx, cx);
          grad.addColorStop(0.00, 'rgba(255,255,255,1)');
          grad.addColorStop(0.14, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.80)');
          grad.addColorStop(0.38, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.20)');
          grad.addColorStop(0.72, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.04)');
          grad.addColorStop(1.00, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0)');

          g.fillStyle = grad;
          g.beginPath();
          g.arc(cx, cx, cx, 0, Math.PI * 2);
          g.fill();

          g.fillStyle = 'rgba(255,255,255,0.95)';
          g.beginPath();
          g.arc(cx, cx, Math.max(0.4, cx * 0.15), 0, Math.PI * 2);
          g.fill();

          spriteCache.set(key, c);
          return c;
        }

        function getFlare() {
          if (flareSprite) return flareSprite;
          const s = 64;
          const c = document.createElement('canvas');
          c.width = s;
          c.height = s;
          const g = c.getContext('2d');
          const mid = s / 2;
          const h = g.createLinearGradient(0, mid, s, mid);
          h.addColorStop(0, 'rgba(255,255,255,0)');
          h.addColorStop(0.5, 'rgba(255,255,255,0.8)');
          h.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = h;
          g.fillRect(0, mid - 0.55, s, 1.1);
          const v = g.createLinearGradient(mid, 0, mid, s);
          v.addColorStop(0, 'rgba(255,255,255,0)');
          v.addColorStop(0.5, 'rgba(255,255,255,0.8)');
          v.addColorStop(1, 'rgba(255,255,255,0)');
          g.fillStyle = v;
          g.fillRect(mid - 0.55, 0, 1.1, s);
          flareSprite = c;
          return c;
        }

        function build() {
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          canvas.width = Math.floor(W * dpr);
          canvas.height = Math.floor(H * dpr);
          canvas.style.width = W + 'px';
          canvas.style.height = H + 'px';
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const density = Math.round((W * H) / 1500);
          const count = Math.min(1500, Math.max(420, density));

          stars = [];
          for (let i = 0; i < count; i++) {
            const roll = Math.random();
            let bucket = 0;
            if (roll > 0.9955) bucket = 3;
            else if (roll > 0.972) bucket = 2;
            else if (roll > 0.85) bucket = 1;

            stars.push({
              x: Math.random() * W,
              y: Math.random() * H,
              depth: 0.25 + Math.random() * 0.75,
              bucket: bucket,
              tint: [0, 0, 0, 1, 3, 2][Math.floor(Math.random() * 6)],
              base: 0.28 + Math.random() * 0.62,
              speed: 0.35 + Math.random() * 1.5,
              phase: Math.random() * Math.PI * 2,
              angle: Math.random() * Math.PI,
              hasFlare: bucket === 3
            });
          }
        }

        function spawnShooting() {
          const goLeft = Math.random() > 0.5;
          const speed = 380 + Math.random() * 320;
          shooting = {
            x: W * (0.15 + Math.random() * 0.7),
            y: H * (0.05 + Math.random() * 0.35),
            vx: (goLeft ? -1 : 1) * speed * 0.85,
            vy: speed * 0.45,
            life: 0,
            max: 0.9 + Math.random() * 0.5
          };
        }

        function draw(now) {
          const t = now / 1000;
          const dt = Math.min(0.05, (now - lastT) / 1000);
          lastT = now;

          ctx.clearRect(0, 0, W, H);

          mouseX += (targetX - mouseX) * 0.045;
          mouseY += (targetY - mouseY) * 0.045;
          const px = mouseX * 16;
          const py = mouseY * 16;

          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            const twinkle = 0.7 + 0.3 * Math.sin(t * s.speed + s.phase);
            const alpha = Math.min(1, s.base * twinkle);
            const size = BASE_SIZE[s.bucket] * (0.6 + s.depth * 0.8);
            const x = s.x + px * s.depth;
            const y = s.y + py * s.depth;

            ctx.globalAlpha = alpha;
            ctx.drawImage(getSprite(s.tint, s.bucket), x - size / 2, y - size / 2, size, size);

            if (s.hasFlare) {
              const fs = size * 6;
              ctx.globalAlpha = alpha * 0.3;
              ctx.save();
              ctx.translate(x, y);
              ctx.rotate(s.angle);
              ctx.drawImage(getFlare(), -fs / 2, -fs / 2, fs, fs);
              ctx.restore();
            }
          }
          ctx.globalAlpha = 1;

          if (!reduceMotion) {
            if (!shooting) {
              nextShot -= dt * 1000;
              if (nextShot <= 0) {
                spawnShooting();
                nextShot = 7000 + Math.random() * 12000;
              }
            } else {
              const p = shooting;
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.life += dt;

              const tailX = p.x - p.vx * 0.13;
              const tailY = p.y - p.vy * 0.13;
              const fade = Math.max(0, 1 - p.life / p.max);

              const grad = ctx.createLinearGradient(p.x, p.y, tailX, tailY);
              grad.addColorStop(0, 'rgba(255,255,255,0.95)');
              grad.addColorStop(0.35, 'rgba(190,220,255,0.32)');
              grad.addColorStop(1, 'rgba(190,220,255,0)');

              ctx.globalAlpha = fade;
              ctx.strokeStyle = grad;
              ctx.lineWidth = 1.6;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(tailX, tailY);
              ctx.stroke();

              ctx.globalAlpha = fade * 0.85;
              ctx.drawImage(getSprite(0, 3), p.x - 8, p.y - 8, 16, 16);
              ctx.globalAlpha = 1;

              if (p.life > p.max || p.x < -300 || p.x > W + 300 || p.y > H + 300) {
                shooting = null;
              }
            }
          }
        }

        function loop(now) {
          draw(now);
          rafId = requestAnimationFrame(loop);
        }

        function start() {
          if (rafId !== null) cancelAnimationFrame(rafId);
          lastT = performance.now();
          if (reduceMotion) {
            draw(performance.now());
            rafId = null;
            return;
          }
          rafId = requestAnimationFrame(loop);
        }

        function stop() {
          if (rafId !== null) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
        }

        let resizeTimer = null;
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            build();
            if (reduceMotion) draw(performance.now());
          }, 140);
        });

        window.addEventListener('pointermove', function (e) {
          targetX = (e.clientX / W) * 2 - 1;
          targetY = (e.clientY / H) * 2 - 1;
        }, { passive: true });

        document.addEventListener('visibilitychange', function () {
          if (reduceMotion) return;
          if (document.hidden) stop();
          else start();
        });

        build();
        start();
      })();

    </script>
    <script src="/js/starfield.js" defer></script>
    <script src="/js/sw-register.js" defer></script>
    <script>
      // =========================================================
      // PWA INSTALL PROMPT (bottom-right)
      // =========================================================
      (function installPrompt() {
        const prompt = document.getElementById('installPrompt');
        const btn = document.getElementById('installPromptBtn');
        const close = document.getElementById('installPromptClose');
        if (!prompt || !btn || !close) return;

        let deferredPrompt = null;

        function show() {
          // Show on every page load — only a successful install (or the
          // standalone display mode) keeps it hidden.
          if (window.matchMedia('(display-mode: standalone)').matches) return;
          prompt.classList.add('is-visible');
        }
        function hide() {
          prompt.classList.remove('is-visible');
        }

        // Cursor-following glow, same effect as the homepage nav buttons
        const glow = btn.querySelector('.install-prompt-download-glow');
        if (glow) {
          btn.addEventListener('mousemove', function (e) {
            const rect = btn.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            glow.style.background =
              'radial-gradient(circle at ' + x + 'px ' + y + 'px, rgba(255,255,255,0.16) 0%, transparent 60%)';
          });
          btn.addEventListener('mouseleave', function () {
            glow.style.background = '';
          });
        }

        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
          // slight delay so it doesn't fight the page intro
          setTimeout(show, 1200);
        });

        btn.addEventListener('click', async () => {
          if (!deferredPrompt) return;
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          deferredPrompt = null;
          hide();
          if (outcome === 'accepted') {
            btn.textContent = 'Geïnstalleerd';
          }
        });

        // Closing only hides it for this page view — it returns on next load
        close.addEventListener('click', hide);

        window.addEventListener('appinstalled', hide);
      })();
    </script>
    <script src="/js/ui-settings.js"></script>
