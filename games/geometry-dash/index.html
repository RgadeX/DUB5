<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Dash - DUB5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/showcase/showcase.css">
<style>
  .game-shell {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .game-stage {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(2, 4, 16, 0.72);
  }
  .game-stage iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
  }
  @media (max-width: 640px) {
    .page { padding: 4.5rem 0.75rem 0.75rem; }
  }
</style>
</head>
<body>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <a class="back-link-fixed" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="m12 19-7-7 7-7"/>
    </svg>
    Terug
  </a>

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Geometry Dash</h1>
      <p class="page-subline">De volledige game — eenmalig downloaden, daarna offline speelbaar.</p>
    </header>

    <div class="header-rule" aria-hidden="true"></div>

    <div class="game-shell">
      <div class="game-stage">
        <iframe src="/geometry-dash/game.html" title="Geometry Dash" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="/geometry-dash/starfield.js" defer></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
