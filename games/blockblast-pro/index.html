<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<base href="/block-blast/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Block Blast - DUB5</title>
<meta name="theme-color" content="#0b1150" />
<link rel="icon" type="image/png" href="game_logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../showcase/showcase.css">
<style>

	/* Disable user selection to avoid strange bug in Chrome on Windows:
	* Selecting a text outside the canvas, then clicking+draging would
	* drag the selected text but block mouse down/up events to the engine.
	*/
	body {
	
		position: fixed; /* Prevent overscroll */
	
		margin:0;
		padding:0;
	}

	.canvas-app-container {
		width: 100%;
		height: 100%;
		position: absolute;
		align-items: center;
		justify-content: center;
		overflow: hidden;
	}

	.canvas-app-container:-webkit-full-screen {
		/* Auto width and height in Safari/Chrome fullscreen. */
		width: auto;
		height: auto;
	}

	#canvas {
		outline: none;
		border: 0;
		width: 100%;
		vertical-align: bottom;
	}

	#canvas-container {
		position: relative;
	}

	canvas:focus, canvas:active {
		outline: none;
		border: 0;
		ie-dummy: expression(this.hideFocus=true);
		-moz-outline-style: none;
	}

	body, div {
		-webkit-tap-highlight-color: rgba(0,0,0,0);
		-webkit-touch-callout: none;
		-webkit-user-select: none;
		-khtml-user-select: none;
		-moz-user-select: none;
		-ms-user-select: none;
		user-select: none;
	}

	.loading-screen-container {
		position: absolute;
		top: 0;
		left: 0;
        height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    
    .message {
        height: 30px;
        display: flex;
        align-items: center;
        font-family: Verdana, Helvetica, sans-serif;
    }

	.logo-small {
		width: 100%;
		max-width: 180px;
	}
    
    .logo {
		width: 100%;
		max-width: 256px;
		height: auto;
		animation: scalePulse 1.2s infinite;
	}

	@keyframes scalePulse {
		0% {
			transform: scale(1); /* Начальный размер */
		}
		50% {
			transform: scale(1.1);
		}
		100% {
			transform: scale(1);
		}
	}
    
    .loading-bar {
        margin-top: 0px;
        width: 180px;
      display: flex;
      background: rgba(255,255,255,0.1);
    }

    .main-container {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

	.block {
		background: linear-gradient(#FF6B6B, #FF3B3B); /* Градиент от светлого красного к тёмному красному */
		border-top: 5px solid #FF8C8C; /* Светло-красный */
		border-bottom: 5px solid #B20000; /* Тёмно-красный */
		border-left: 5px solid #FF5A5A; /* Средний красный */
		border-right: 5px solid #CC0000; /* Более глубокий красный */
		width: 20px;
		min-width: 20px;
		height: 20px;
		min-height: 20px;
		box-shadow: 1px 2px 36px #FFAAAA7A; /* Красное свечение */
		opacity: 0;
		animation: fadeInOut 3s linear 0s infinite;
	}
    
    .block:nth-child(2) { 
        animation: fadeInOut1 3s linear 0s infinite;
    }
    
    .block:nth-child(3) {
        animation: fadeInOut2 3s linear 0s infinite;
    }
    
    .block:nth-child(4) {
        animation: fadeInOut3 3s linear 0s infinite;
    }
    
    .block:nth-child(5) {
        animation: fadeInOut4 3s linear 0s infinite;
    }
    
    .block:nth-child(6) {
        animation: fadeInOut5 3s linear 0s infinite;
    }
    
    @keyframes fadeInOut {
      0%, 15% {
        opacity: 0;
        transform: scale(0.5);
      }
      20%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeInOut1 {
      0%, 30% {
        opacity: 0;
        transform: scale(0.5);
      }
      35%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeInOut2 {
      0%, 45% {
        opacity: 0;
        transform: scale(0.5);
      }
      50%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeInOut3 {
      0%, 60% {
        opacity: 0;
        transform: scale(0.5);
      }
      66%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeInOut4 {
      0%, 75% {
        opacity: 0;
        transform: scale(0.5);
      }
      81%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }
    @keyframes fadeInOut5 {
      0%, 90% {
        opacity: 0;
        transform: scale(0.5);
      }
      96%, 100% {
        opacity: 1;
        transform: scale(1);
      }
    }

		.canvas-app-progress {
		position: absolute;
		background-color: #d1dbeb;
		height: 6px;
		margin-top: -6px;
		width: 100%;
	}

	.canvas-app-progress-bar {
		font-size: 12px;
		height: 6px;
		color: rgb(255, 255, 255);
		background-color: #1a72eb;
		text-align: center;
		line-height: 20px;
		transition: transform 1s ease;
		transform-origin: left;
		transform: scaleX(1.0);
	}


	.link, .button {
		font-family: sans-serif;
		font-size: 14px;
		font-weight: normal;
		font-style: normal;
		font-stretch: normal;
		line-height: normal;
		letter-spacing: 0px;
		padding-top: 12px;
	}

	.buttons-background {
		background-color: #ffffff;
		width: 100%;
		height: 42px;
	}

	body {
		background-color: #52AAEC;
	}

	.canvas-app-canvas {

	}

	.canvas-app-container {
		background: #52AAEC;
	}
	
  /* ===== DUB5 shell overrides ===== */
  html, body { height: auto; overflow-x: hidden; }
  body {
    position: relative !important;
    margin: 0;
    background: radial-gradient(140% 100% at 50% -10%, #0b1150 0%, #050833 42%, #01030f 100%) !important;
    background-attachment: fixed;
  }
  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(42% 34% at 16% 10%, rgba(70, 110, 255, 0.20), transparent 68%),
      radial-gradient(38% 30% at 86% 16%, rgba(150, 80, 255, 0.15), transparent 66%),
      radial-gradient(58% 42% at 52% 108%, rgba(0, 130, 230, 0.18), transparent 72%);
    filter: blur(26px);
  }
  .page {
    padding: 1.5rem 1.5rem 1rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .page-header { margin-bottom: 0.5rem; }
  .page-title { font-size: 3rem; }
  .page-subline { font-size: 0.85rem; }
  .header-rule { margin-top: 0.5rem; }
  .game-shell {
    position: relative;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 0.75rem;
  }
  .game-shell-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 0.5rem;
  }
  .fullscreen-btn {
    width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(9, 13, 38, 0.72);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset);
    display: grid; place-items: center;
    cursor: pointer; color: var(--ink-dim);
    transition: all 200ms ease; padding: 0; font: inherit;
  }
  .fullscreen-btn:hover { color: #fff; border-color: var(--line-strong); background: var(--glass-hover); }
  .fullscreen-btn svg { width: 16px; height: 16px; }
  .game-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 590 / 960;
    max-height: 78vh;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }
  .canvas-app-container {
    position: absolute !important;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    background: #000 !important;
  }
  .canvas-app-canvas-container { position: absolute; inset: 0; }
  #canvas { width: 100% !important; height: 100% !important; }
  .buttons-background { display: none; }
  .loading-screen-container { background: rgba(1, 3, 15, 0.85); }
  .page-footer {
    margin-top: 0.75rem; font-size: 0.75rem; color: var(--ink-dim);
    text-align: center; opacity: 0; animation: fade-in 700ms ease-out 620ms forwards;
  }
  @media (max-width: 768px) {
    .page { padding: 1rem 1rem 0.75rem; }
    .page-title { font-size: 2rem; }
    .game-shell { padding: 0.6rem; }
  }
</style>
<script type="text/javascript" src="poki-stub.js"></script>
<script type="text/javascript" src="GameAnalytics.js"></script>
</head>
<body>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <a class="back-link-fixed" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="m12 19-7-7 7-7"/>
    </svg>
    Terug
  </a>

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Block Blast</h1>
      <p class="page-subline">Het origineel — blokken plaatsen en lijnen cleared maken.</p>
    </header>

    <div class="header-rule" aria-hidden="true"></div>

    <div class="game-shell">
      <div class="game-shell-header">
        <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Volledig scherm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
      <div class="game-stage" id="game-stage">
        <div id="app-container" class="canvas-app-container">
          <div id="running-from-file-warning" style="display: none; margin: 3em;">
            <h1>Running from local file</h1>
            <p>Open this page via a web server, not file://</p>
          </div>
          <div id="webgl-not-supported" style="display: none; margin: 3em;">
            <h1>WebGL not supported</h1>
            <p>WebGL is not supported by your browser.</p>
          </div>
          <div id="canvas-container" class="canvas-app-canvas-container">
            <canvas id="canvas" class="canvas-app-canvas" tabindex="1" width="590" height="960"></canvas>
          </div>
        </div>
      </div>
    </div>

    <p class="page-footer">© 2026 DUB5. Alle rechten voorbehouden.</p>
  </div>

  <script id="engine-loader" type="text/javascript" src="dmloader.js"></script>
  <script id="engine-setup" type="text/javascript"></script>
  <script id="custom-progress-bar" type="text/javascript">
		ProgressView.addProgress = function(canvas) {
			canvas.insertAdjacentHTML('afterend',
			`
				<div class="loading-screen-container" id="loading-screen-container">
       				<div class="main-container">
       				    <img src="game_logo.png" class="logo">
						<div class="message" id="percentage" style="margin-top: 6px;">0%</div>
       				    <div class="loading-bar">
       				        <div class="block"></div>
       				        <div class="block"></div>
       				        <div class="block"></div>
       				        <div class="block"></div>
       				        <div class="block"></div>
       				        <div class="block"></div>
       				      </div>
       				    <div class="message" id="message"></div>
       				</div>
    			</div>
			`)

			ProgressView.progress = document.getElementById("loading-screen-container");
			document.getElementById("percentage").style.fontFamily = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif";
			function updateProgress(percentage) {
				let percentageText = document.getElementById("percentage")
				if (percentageText){
					percentageText.innerHTML = Math.min(Math.ceil(percentage), 100) + "%";
				}
			}
			Progress.addListener(updateProgress);

			const phrases = ["Polishing blocks...", "Preparing gems...", "Loading effects...", "Loading game..."];
        	let index = 0;

        	function changeText() {
				let messageText = document.getElementById("message")
				if (messageText) {
					messageText.innerHTML = phrases[index];
				}
        	    index++;
        	    if (index < phrases.length) {
        	        setTimeout(changeText, 2000);
        	    }
        	}
        	changeText();
		};
	</script>
  <script id="engine-start" type="text/javascript">
		var runningFromFileWarning = document.getElementById("running-from-file-warning");
		if (window.location.href.startsWith("file://")) {
			runningFromFileWarning.style.display = "block";
		}
		else {
			EngineLoader.load("canvas", "blockypuzzle");
			runningFromFileWarning.parentNode.removeChild(runningFromFileWarning);
		}
	</script>
  <script id="poki-sdk-setup" type="text/javascript">
		var data = {};
		var isLoadFinished = false;
		Progress.addListener(function(percentage){
			data.percentageDone = percentage / 100;
			if (!isLoadFinished)
				PokiSDK.gameLoadingProgress(data);
			if (percentage == 100 && !isLoadFinished) {
				PokiSDK.gameLoadingFinished();
				isLoadFinished = true;
			}
		});
		Module['onRuntimeInitialized'] = function() {
			PokiSDK.init().then(()=>{
				Module.runApp("canvas");
			}, ()=>{
				Module.runApp("canvas");
			});
		};
	</script>
  <script>
    // Fullscreen toggle (same behavior as snake page)
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    if (fullscreenBtn) {
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
        } else {
          document.exitFullscreen();
        }
      });
    }
    // Register the site service worker so this game works offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
