<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway Surfers - DUB5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/showcase/showcase.css">
<script src="/subway-surfers/poki-stub.js"></script>
<style>
  html, body {
    overflow: hidden;
    height: 100%;
  }

  .page {
    padding: 1rem 1rem 0.5rem;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .page-header {
    margin-bottom: 0.5rem;
  }

  .page-title {
    font-size: 2.5rem;
  }

  .page-subline {
    font-size: 0.8rem;
  }

  .header-rule {
    margin-top: 0.5rem;
    margin-bottom: 0.75rem;
  }

  .game-shell {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    border-radius: 18px;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    flex: 1;
    min-height: 0;
  }
  .game-shell-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 0.5rem;
  }
  .fullscreen-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(9, 13, 38, 0.72);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all 200ms ease;
    padding: 0;
    font: inherit;
  }
  .fullscreen-btn:hover {
    color: #fff;
    border-color: var(--line-strong);
    background: var(--glass-hover);
  }
  .fullscreen-btn svg {
    width: 16px;
    height: 16px;
  }
  .game-stage {
    position: relative;
    flex: 1;
    width: 100%;
    max-width: 1050px;
    margin: 0 auto;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(2, 4, 16, 0.72);
    min-height: 0;
    aspect-ratio: 16 / 9;
  }
  #game-iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #0b316b;
  }
  @media (max-width: 640px) {
    .page { padding: 0.75rem 0.5rem 0.25rem; }
    .page-title { font-size: 1.75rem; }
    .page-subline { font-size: 0.7rem; }
    .game-shell { padding: 0.4rem; }
  }
</style>
</head>
<body>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <a class="back-link-fixed" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="m12 19-7-7 7-7"/>
    </svg>
    Terug
  </a>

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Subway Surfers</h1>
      <p class="page-subline">Ren door het metrostation, ontwijk obstakels en verzamel munten.</p>
    </header>

    <div class="header-rule" aria-hidden="true"></div>

    <div class="game-shell">
      <div class="game-shell-header">
        <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Volledig scherm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
      <div class="game-stage" id="game-stage">
        <iframe id="game-iframe" src="/subway-surfers/game-content.html" title="Subway Surfers" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script src="/showcase/showcase.js"></script>
  <script>
    // Fullscreen toggle
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const gameStage = document.getElementById('game-stage');
    if (fullscreenBtn && gameStage) {
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          gameStage.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
        } else {
          document.exitFullscreen();
        }
      });
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
  <script src="/js/starfield.js" defer></script>
<script src="/js/ui-settings.js"></script>
</body>
</html>
