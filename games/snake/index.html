<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Snake - DUB5</title>
<meta name="theme-color" content="#0b1150" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../showcase/showcase.css">
<style>
  /* Snake-specific styles */
  .page {
    padding: 1.5rem 1.5rem 1rem;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .page-header {
    margin-bottom: 0.5rem;
  }

  .page-title {
    font-size: 3rem;
  }

  .page-subline {
    font-size: 0.85rem;
  }

  .header-rule {
    margin-top: 0.5rem;
  }

  .game-shell {
    position: relative;
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 0.75rem;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .game-shell-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.5rem;
  }

  .hud {
    display: flex;
    justify-content: space-between;
    gap: 0.5rem;
    opacity: 0;
    transition: opacity 220ms ease;
  }

  .hud.is-visible { opacity: 1; }

  .hud-item {
    padding: 0.35rem 0.75rem;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset);
    font-size: 0.75rem;
    font-weight: 600;
    color: rgba(226, 240, 255, 0.85);
  }

  .hud-item strong {
    color: #fff;
    font-weight: 700;
    margin-left: 0.15rem;
  }

  .fullscreen-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(9, 13, 38, 0.72);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all 200ms ease;
    padding: 0;
    font: inherit;
  }

  .game-stage {
    position: relative;
    flex: 1;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(2, 4, 16, 0.72);
    aspect-ratio: 4 / 3;
  }

  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .fullscreen-btn:hover {
    border-color: var(--line-strong);
    background: rgba(13, 19, 50, 0.82);
    color: #fff;
    transform: translateY(-1px);
  }

  .fullscreen-btn svg {
    width: 16px;
    height: 16px;
  }

  .overlay {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: flex;
    flex-direction: column;
    background: rgba(3, 5, 20, 0.9);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border-radius: 12px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 220ms ease;
  }

  .overlay.is-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1rem 0.5rem;
  }

  .settings-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0.75rem 0.85rem;
  }

  .settings-group { min-width: 0; }

  .settings-label {
    display: block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(226, 240, 255, 0.55);
    margin-bottom: 0.4rem;
  }

  .option-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
  }

  .option {
    appearance: none;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    border-radius: 10px;
    padding: 0.35rem 0.4rem 0.3rem;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.15rem;
    transition: all 200ms ease;
    color: var(--ink-dim);
    font: inherit;
    font-size: 0.6rem;
    font-weight: 600;
    min-width: 50px;
  }

  .option:hover {
    border-color: var(--line-strong);
    background: rgba(255, 255, 255, 0.06);
    color: #fff;
    transform: translateY(-1px);
  }

  .option.is-active {
    border-color: rgba(190, 215, 255, 0.75);
    background: rgba(190, 215, 255, 0.14);
    color: #fff;
    box-shadow: 0 0 0 3px rgba(190, 215, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }

  .option-label {
    line-height: 1;
    white-space: nowrap;
  }

  .overlay-actions {
    padding: 0.6rem 1rem 0.75rem;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    background: rgba(3, 5, 20, 0.45);
    flex-wrap: wrap;
  }

  .btn-primary,
  .btn-ghost {
    appearance: none;
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 0.5rem 1.25rem;
    border-radius: 999px;
    cursor: pointer;
    transition: all 200ms ease;
    white-space: nowrap;
  }

  .btn-primary {
    border: 1px solid rgba(190, 215, 255, 0.45);
    background: linear-gradient(180deg, rgba(190, 215, 255, 0.22), rgba(190, 215, 255, 0.08));
    color: #fff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
  }

  .btn-primary:hover {
    background: linear-gradient(180deg, rgba(190, 215, 255, 0.32), rgba(190, 215, 255, 0.12));
    transform: translateY(-1px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 10px 24px -12px rgba(190, 215, 255, 0.6);
  }

  .btn-ghost {
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--ink-dim);
  }

  .btn-ghost:hover {
    border-color: var(--line-strong);
    color: #fff;
    background: rgba(255, 255, 255, 0.09);
    transform: translateY(-1px);
  }

  .gameover-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 1rem;
    text-align: center;
    gap: 0.25rem;
  }

  .gameover-content h2 {
    font-size: 2rem;
    margin-bottom: 0.15rem;
  }

  .gameover-score {
    font-size: 0.85rem;
    color: var(--ink-dim);
    margin-bottom: 0.1rem;
  }

  .gameover-score strong {
    color: #fff;
    font-size: 1.25rem;
    font-weight: 700;
    display: inline-block;
    margin-left: 0.15rem;
  }

  .gameover-best {
    font-size: 0.75rem;
    color: rgba(226, 240, 255, 0.45);
  }

  .page-footer {
    margin-top: 0.75rem;
    font-size: 0.75rem;
    color: var(--ink-dim);
    text-align: center;
    opacity: 0;
    animation: fade-in 700ms ease-out 620ms forwards;
  }

  @media (max-width: 768px) {
    .page { padding: 1rem 1rem 0.75rem; }
    .page-title { font-size: 2rem; }
    .settings-grid { grid-template-columns: 1fr; }
    .overlay-scroll { padding: 0.85rem 0.85rem 0.5rem; }
    .overlay-actions { padding: 0.5rem 0.85rem 0.65rem; }
  }
</style>

<body>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <a class="back-link-fixed" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    Terug

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Snake</h1>
      <p class="page-subline">Kies je stijl, eet de vruchten en groei zo lang als je kan.</p>
    </header>

    <div class="header-rule" aria-hidden="true"></div>

    <div class="game-shell">

          <div class="hud-item">Score<strong id="hudScore">0</strong></div>
        </div>
        <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Volledig scherm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>

      <div class="game-stage">
        <canvas id="game-canvas" width="640" height="480" aria-label="Snake speelveld"></canvas>

<script src="../showcase/showcase.js"></script>
<script>
/* =========================================================
   SNAKE GAME
   ========================================================= */
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');

const GAME_CONFIG = {
  snakeSpeed: 4,
  snakeRadius: 12,
  fruitRadius: 12,
  snakeColor: '#4cc9f0',
  fruitColor: '#ef4444',
  speed: 16,
  baseZoom: 1,
  zoomDecreasePerFruit: 0.05,
  segmentsPerFruit: 5
};

let snake = [];
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let directionQueue = [];
let fruit = { x: 0, y: 0 };
let score = 0;
let gameLoop = null;
let isPlaying = false;
let canvasWidth = 0;
let canvasHeight = 0;
let zoomScale = 1;
let growthCounter = 0;

function saveGameState() {
  try {
    const state = {
      snake: snake,
      direction: direction,
      nextDirection: nextDirection,
      directionQueue: directionQueue,
      fruit: fruit,
      score: score,
      snakeColor: GAME_CONFIG.snakeColor,
      speed: GAME_CONFIG.speed,
      zoomScale: zoomScale,
      growthCounter: growthCounter
    };
    localStorage.setItem('dub5:snake:gamestate', JSON.stringify(state));
  } catch (e) {
    console.error('Failed to save game state:', e);
  }
}

function loadGameState() {
  try {
    const saved = localStorage.getItem('dub5:snake:gamestate');
    if (saved) {
      const state = JSON.parse(saved);
      return state;
    }
  } catch (e) {
    console.error('Failed to load game state:', e);
  }
  return null;
}

function clearGameState() {
  try {
    localStorage.removeItem('dub5:snake:gamestate');
  } catch (e) {
    console.error('Failed to clear game state:', e);
  }
}

function initCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const rect = canvas.getBoundingClientRect();
  
  canvas.width = Math.floor(rect.width * dpr);
  canvas.height = Math.floor(rect.height * dpr);
  
  ctx.scale(dpr, dpr);
  
  canvasWidth = rect.width;
  canvasHeight = rect.height;
}

function updateZoom() {
  // Calculate zoom based on fruits eaten
  const fruitsEaten = Math.floor((snake.length - 3) / GAME_CONFIG.segmentsPerFruit);
  const zoomDecrease = fruitsEaten * GAME_CONFIG.zoomDecreasePerFruit;
  zoomScale = Math.max(0.3, GAME_CONFIG.baseZoom - zoomDecrease);
}

function spawnFruit() {
  const margin = GAME_CONFIG.fruitRadius * 2;
  const minDistance = GAME_CONFIG.snakeRadius + GAME_CONFIG.fruitRadius + 10;
  
  let attempts = 0;
  let validPosition = false;
  let newFruit;
  
  // Spawn in the middle 50% of the canvas area
  const middleAreaWidth = canvasWidth * 0.5;
  const middleAreaHeight = canvasHeight * 0.5;
  const startX = (canvasWidth - middleAreaWidth) / 2;
  const startY = (canvasHeight - middleAreaHeight) / 2;
  
  while (!validPosition && attempts < 100) {
    newFruit = {
      x: startX + margin + Math.random() * (middleAreaWidth - margin * 2),
      y: startY + margin + Math.random() * (middleAreaHeight - margin * 2)
    };
    
    // Check if position overlaps with snake body
    validPosition = true;
    for (const segment of snake) {
      const dist = Math.hypot(newFruit.x - segment.x, newFruit.y - segment.y);
      if (dist < minDistance) {
        validPosition = false;
        break;
      }
    }
    
    attempts++;
  }
  
  fruit = newFruit;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Apply zoom transform centered on canvas
  ctx.save();
  ctx.translate(canvasWidth / 2, canvasHeight / 2);
  ctx.scale(zoomScale, zoomScale);
  ctx.translate(-canvasWidth / 2, -canvasHeight / 2);
  
  // Draw fruit with glass effect
  const fruitX = fruit.x;
  const fruitY = fruit.y;
  const fruitRadius = GAME_CONFIG.fruitRadius;
  
  // Fruit glow
  const fruitGlow = ctx.createRadialGradient(fruitX, fruitY, 0, fruitX, fruitY, fruitRadius * 2);
  fruitGlow.addColorStop(0, 'rgba(239, 68, 68, 0.4)');
  fruitGlow.addColorStop(1, 'rgba(239, 68, 68, 0)');
  ctx.fillStyle = fruitGlow;
  ctx.beginPath();
  ctx.arc(fruitX, fruitY, fruitRadius * 2, 0, Math.PI * 2);
  ctx.fill();
  
  // Fruit body with gradient
  const fruitGrad = ctx.createRadialGradient(fruitX - fruitRadius * 0.3, fruitY - fruitRadius * 0.3, 0, fruitX, fruitY, fruitRadius);
  fruitGrad.addColorStop(0, '#fca5a5');
  fruitGrad.addColorStop(0.5, '#ef4444');
  fruitGrad.addColorStop(1, '#b91c1c');
  ctx.fillStyle = fruitGrad;
  ctx.beginPath();
  ctx.arc(fruitX, fruitY, fruitRadius, 0, Math.PI * 2);
  ctx.fill();
  
  // Fruit highlight
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.beginPath();
  ctx.arc(fruitX - fruitRadius * 0.3, fruitY - fruitRadius * 0.3, fruitRadius * 0.25, 0, Math.PI * 2);
  ctx.fill();
  
  // Draw snake with glassmorphism
  if (snake.length > 0) {
    const headRadius = GAME_CONFIG.snakeRadius;
    const bodyRadius = GAME_CONFIG.snakeRadius * 0.85;
    
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    // Helper function to draw snake segments with wrap-around handling
    function drawSnakeSegments(lineWidth, color, alpha) {
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.globalAlpha = alpha;
      
      if (snake.length > 0) {
        ctx.beginPath();
        ctx.moveTo(snake[0].x, snake[0].y);
        
        for (let i = 1; i < snake.length; i++) {
          const prev = snake[i - 1];
          const curr = snake[i];
          
          // Check for wrap-around (large jump in coordinates)
          const dist = Math.abs(curr.x - prev.x) + Math.abs(curr.y - prev.y);
          // Use a smaller threshold to catch wrap-around more reliably
          if (dist > canvasWidth * 0.4 || dist > canvasHeight * 0.4) {
            // Break the path and start new segment
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(curr.x, curr.y);
          } else {
            ctx.lineTo(curr.x, curr.y);
          }
        }
        
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    
    // Outer glow layer
    drawSnakeSegments(bodyRadius * 3.5, GAME_CONFIG.snakeColor, 0.25);
    
    // Glass layer 1 - darker base
    drawSnakeSegments(bodyRadius * 2.6, GAME_CONFIG.snakeColor, 0.6);
    
    // Glass layer 2 - lighter core
    const lighterColor = lightenColor(GAME_CONFIG.snakeColor, 40);
    drawSnakeSegments(bodyRadius * 1.8, lighterColor, 0.7);
    
    // Glass layer 3 - bright highlight center
    const highlightColor = lightenColor(GAME_CONFIG.snakeColor, 70);
    drawSnakeSegments(bodyRadius * 0.8, highlightColor, 0.5);
    
    // Head with glass effect
    const headX = snake[0].x;
    const headY = snake[0].y;
    
    // Head glow
    const headGlow = ctx.createRadialGradient(headX, headY, 0, headX, headY, headRadius * 1.5);
    headGlow.addColorStop(0, GAME_CONFIG.snakeColor + '40');
    headGlow.addColorStop(1, GAME_CONFIG.snakeColor + '00');
    ctx.fillStyle = headGlow;
    ctx.beginPath();
    ctx.arc(headX, headY, headRadius * 1.5, 0, Math.PI * 2);
    ctx.fill();
    
    // Head base with gradient
    const headGrad = ctx.createRadialGradient(headX - headRadius * 0.3, headY - headRadius * 0.3, 0, headX, headY, headRadius);
    headGrad.addColorStop(0, lighterColor);
    headGrad.addColorStop(0.5, GAME_CONFIG.snakeColor);
    headGrad.addColorStop(1, darkenColor(GAME_CONFIG.snakeColor, 20));
    ctx.fillStyle = headGrad;
    ctx.beginPath();
    ctx.arc(headX, headY, headRadius, 0, Math.PI * 2);
    ctx.fill();
    
    // Head highlight
    ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
    ctx.beginPath();
    ctx.arc(headX - headRadius * 0.35, headY - headRadius * 0.35, headRadius * 0.3, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = '#fff';
    const eyeOffset = headRadius * 0.4;
    const eyeRadius = headRadius * 0.28;
    const pupilRadius = eyeRadius * 0.5;
    
    let eye1X = headX, eye1Y = headY;
    let eye2X = headX, eye2Y = headY;
    
    if (direction.x === 1) {
      eye1X = headX + eyeOffset; eye1Y = headY - eyeOffset * 0.5;
      eye2X = headX + eyeOffset; eye2Y = headY + eyeOffset * 0.5;
    } else if (direction.x === -1) {
      eye1X = headX - eyeOffset; eye1Y = headY - eyeOffset * 0.5;
      eye2X = headX - eyeOffset; eye2Y = headY + eyeOffset * 0.5;
    } else if (direction.y === 1) {
      eye1X = headX - eyeOffset * 0.5; eye1Y = headY + eyeOffset;
      eye2X = headX + eyeOffset * 0.5; eye2Y = headY + eyeOffset;
    } else {
      eye1X = headX - eyeOffset * 0.5; eye1Y = headY - eyeOffset;
      eye2X = headX + eyeOffset * 0.5; eye2Y = headY - eyeOffset;
    }
    
    // Eye whites with gradient
    [eye1X, eye2X].forEach((ex, i) => {
      const ey = i === 0 ? eye1Y : eye2Y;
      const eyeGrad = ctx.createRadialGradient(ex - eyeRadius * 0.3, ey - eyeRadius * 0.3, 0, ex, ey, eyeRadius);
      eyeGrad.addColorStop(0, '#ffffff');
      eyeGrad.addColorStop(1, '#e0e7ff');
      ctx.fillStyle = eyeGrad;
      ctx.beginPath();
      ctx.arc(ex, ey, eyeRadius, 0, Math.PI * 2);
      ctx.fill();
    });
    
    // Pupils
    ctx.fillStyle = '#0a0d26';
    ctx.beginPath();
    ctx.arc(eye1X + direction.x * 2, eye1Y + direction.y * 2, pupilRadius, 0, Math.PI * 2);
    ctx.arc(eye2X + direction.x * 2, eye2Y + direction.y * 2, pupilRadius, 0, Math.PI * 2);
    ctx.fill();
    
    // Pupil highlights
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    ctx.beginPath();
    ctx.arc(eye1X + direction.x * 2 - 1, eye1Y + direction.y * 2 - 1, pupilRadius * 0.4, 0, Math.PI * 2);
    ctx.arc(eye2X + direction.x * 2 - 1, eye2Y + direction.y * 2 - 1, pupilRadius * 0.4, 0, Math.PI * 2);
    ctx.fill();
  }
  
  ctx.restore();
}

function lightenColor(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.min(255, (num >> 16) + amt);
  const G = Math.min(255, ((num >> 8) & 0x00FF) + amt);
  const B = Math.min(255, (num & 0x0000FF) + amt);
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

function darkenColor(hex, percent) {
  const num = parseInt(hex.replace('#', ''), 16);
  const amt = Math.round(2.55 * percent);
  const R = Math.max(0, (num >> 16) - amt);
  const G = Math.max(0, ((num >> 8) & 0x00FF) - amt);
  const B = Math.max(0, (num & 0x0000FF) - amt);
  return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
}

function update() {
  // Process direction queue for rapid movements
  if (directionQueue.length > 0) {
    direction = directionQueue.shift();
  } else {
    direction = { ...nextDirection };
  }
  
  // Move head in current direction
  const head = {
    x: snake[0].x + direction.x * GAME_CONFIG.snakeSpeed,
    y: snake[0].y + direction.y * GAME_CONFIG.snakeSpeed
  };
  
  // Wrap around canvas walls (0 to canvasWidth, 0 to canvasHeight)
  if (head.x < 0) head.x = canvasWidth;
  if (head.x > canvasWidth) head.x = 0;
  if (head.y < 0) head.y = canvasHeight;
  if (head.y > canvasHeight) head.y = 0;
  
  // No self-collision - snake can pass through its own body
  
  snake.unshift(head);
  
  // Check if snake ate fruit (distance check)
  const distToFruit = Math.hypot(head.x - fruit.x, head.y - fruit.y);
  if (distToFruit < GAME_CONFIG.snakeRadius + GAME_CONFIG.fruitRadius) {
    score += 10;
    spawnFruit();
    updateZoom();
    updateHUD();
    saveGameState();
    // Start growth - add segments per fruit
    growthCounter = GAME_CONFIG.segmentsPerFruit;
  }
  
  // Handle growth - don't pop tail while growing
  if (growthCounter > 0) {
    growthCounter--;
  } else {
    snake.pop();
  }
}

function gameOver() {
  // Game over disabled - snake continues playing indefinitely
}

function updateHUD() {
  document.getElementById('hudScore').textContent = score;
}

function showOverlay(id, show) {
  const el = document.getElementById(id);
  if (!el) return;
  if (show) el.classList.add('is-visible');
  else el.classList.remove('is-visible');
}

function startGame() {
  // Clear old saved state (incompatible with new pixel-based system)
  clearGameState();
  
  // Initialize zoom
  zoomScale = GAME_CONFIG.baseZoom;
  growthCounter = 0;
  
  // Start fresh game - position snake in center of canvas
  const startX = canvasWidth / 2;
  const startY = canvasHeight / 2;
  const segmentSpacing = GAME_CONFIG.snakeRadius * 2;
  
  snake = [
    { x: startX, y: startY },
    { x: startX - segmentSpacing, y: startY },
    { x: startX - segmentSpacing * 2, y: startY }
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  directionQueue = [];
  score = 0;
  
  spawnFruit();
  
  updateHUD();
  
  showOverlay('settingsOverlay', false);
  showOverlay('gameOverOverlay', false);
  document.getElementById('hud').classList.add('is-visible');
  
  isPlaying = true;
  gameLoop = setInterval(() => {
    update();
    draw();
  }, GAME_CONFIG.speed);
}

const SETTINGS = [
  {
    key: 'snakeColor',
    label: 'Slang kleur',
    options: [
      { value: '#4cc9f0', label: 'Cyaan' },
      { value: '#a78bfa', label: 'Violet' },
      { value: '#34d399', label: 'Smaragd' },
      { value: '#fb7185', label: 'Roze' },
      { value: '#fbbf24', label: 'Goud' }
    ]
  },
  {
    key: 'speed',
    label: 'Snelheid',
    options: [
      { value: 24, label: 'Slak' },
      { value: 16, label: 'Middel' },
      { value: 12, label: 'Snel' },
      { value: 8, label: 'Bliksem' }
    ]
  }
];

function buildSettingsUI() {
  const grid = document.getElementById('settingsGrid');
  grid.innerHTML = '';
  
  SETTINGS.forEach(group => {
    const groupEl = document.createElement('div');
    groupEl.className = 'settings-group';
    
    const labelEl = document.createElement('span');
    labelEl.className = 'settings-label';
    labelEl.textContent = group.label;
    groupEl.appendChild(labelEl);
    
    const rowEl = document.createElement('div');
    rowEl.className = 'option-row';
    
    group.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.dataset.value = String(opt.value);
      btn.innerHTML = '<span class="option-label">' + opt.label + '</span>';
      
      const currentVal = document.getElementById('game-canvas').dataset[group.key] || SETTINGS[0].options[0].value;
      if (String(opt.value) === currentVal) {
        btn.classList.add('is-active');
      }
      
      btn.addEventListener('click', () => {
        document.getElementById('game-canvas').dataset[group.key] = opt.value;
        GAME_CONFIG[group.key] = opt.value;
        rowEl.querySelectorAll('.option').forEach(b => b.classList.remove('is-active'));
        btn.classList.add('is-active');
        saveGameState();
      });
      
      rowEl.appendChild(btn);
    });
    
    groupEl.appendChild(rowEl);
    grid.appendChild(groupEl);
  });
}

const KEY_DIRS = {
  ArrowUp: { x: 0, y: -1 },
  ArrowDown: { x: 0, y: 1 },
  ArrowLeft: { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 },
  w: { x: 0, y: -1 },
  s: { x: 0, y: 1 },
  a: { x: -1, y: 0 },
  d: { x: 1, y: 0 }
};

function trySetDir(d) {
  if (!isPlaying) return;
  
  // Don't allow 180-degree turns (can't go opposite direction)
  if (snake.length > 0) {
    const lastDir = directionQueue.length > 0 
      ? directionQueue[directionQueue.length - 1] 
      : direction;
    if (lastDir.x === -d.x && lastDir.y === -d.y) return;
  }
  
  // Add to queue for rapid movements - allow rapid key presses
  directionQueue.push(d);
  
  // Limit queue size to prevent huge delays
  if (directionQueue.length > 3) {
    directionQueue.shift();
  }
  
  // Also update nextDirection for backward compatibility
  nextDirection = d;
}

document.addEventListener('keydown', (e) => {
  if (!isPlaying) return;
  
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const d = KEY_DIRS[k];
  if (d) {
    e.preventDefault();
    trySetDir(d);
  }
});

let touchStartX = 0, touchStartY = 0;

canvas.addEventListener('touchstart', (e) => {
  if (!isPlaying) return;
  const t = e.touches[0];
  touchStartX = t.clientX;
  touchStartY = t.clientY;
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  if (!isPlaying) return;
  e.preventDefault();
  
  const t = e.touches[0];
  const dx = t.clientX - touchStartX;
  const dy = t.clientY - touchStartY;
  
  if (Math.hypot(dx, dy) < 24) return;
  
  if (Math.abs(dx) > Math.abs(dy)) {
    trySetDir({ x: dx > 0 ? 1 : -1, y: 0 });
  } else {
    trySetDir({ x: 0, y: dy > 0 ? 1 : -1 });
  }
}, { passive: false });

window.addEventListener('DOMContentLoaded', () => {
  initCanvas();
  buildSettingsUI();
  draw();
  
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
      } else {
        document.exitFullscreen();
      }
    });
  }
  
  document.getElementById('settingsBtn').addEventListener('click', () => {
    isPlaying = false;
    clearInterval(gameLoop);
    snake = [];
    score = 0;
    directionQueue = [];
    clearGameState();
    document.getElementById('hud').classList.remove('is-visible');
    showOverlay('gameOverOverlay', false);
    showOverlay('settingsOverlay', true);
  });
  
  document.getElementById('game-canvas').dataset.snakeColor = '#4cc9f0';
  document.getElementById('game-canvas').dataset.speed = '16';
  
  // Handle window resize
  window.addEventListener('resize', () => {
    initCanvas();
    if (!isPlaying) draw();
  });
  
  // Save game state when leaving the page
  window.addEventListener('beforeunload', () => {
    if (isPlaying) {
      saveGameState();
    }
  });
  
  // Save game state when clicking the back button
  document.querySelector('.back-link-fixed').addEventListener('click', () => {
    if (isPlaying) {
      saveGameState();
    }
  });
  
  // Also use visibility change to save when switching tabs
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && isPlaying) {
      saveGameState();
    }
  });
});
</script>

<script>
// Register the site service worker so this game works offline
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
