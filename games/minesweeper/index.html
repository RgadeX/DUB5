<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mijnenveger - DUB5</title>
<meta name="theme-color" content="#0b1150" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --line: rgba(224, 242, 254, 0.16);
    --line-strong: rgba(224, 242, 254, 0.3);
    --ink: rgb(226, 240, 255);
    --ink-dim: rgba(226, 240, 255, 0.6);

    --glass: rgba(9, 13, 38, 0.62);
    --glass-hover: rgba(13, 19, 50, 0.72);
    --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.09);
    --glass-shadow: 0 18px 40px -26px rgba(0, 0, 0, 1);
    --glass-blur: blur(16px) saturate(160%);

    --nav-hover-transition-duration: 300ms;
    --nav-hover-transition-timing: ease-in-out;

    --r-pill: 999px;
    --r-panel: 18px;
    --r-chip: 12px;

    /* number palette */
    --n1: #4cc9f0;
    --n2: #34d399;
    --n3: #fb7185;
    --n4: #a78bfa;
    --n5: #fb923c;
    --n6: #22d3ee;
    --n7: #f472b6;
    --n8: #e2e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    background: radial-gradient(140% 100% at 50% -10%, #0b1150 0%, #050833 42%, #01030f 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -15%;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(42% 34% at 16% 10%, rgba(70, 110, 255, 0.20), transparent 68%),
      radial-gradient(38% 30% at 86% 16%, rgba(150, 80, 255, 0.15), transparent 66%),
      radial-gradient(58% 42% at 52% 108%, rgba(0, 130, 230, 0.18), transparent 72%);
    filter: blur(26px);
  }

  .stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: block;
  }

  .page {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 3rem 1.5rem 4rem;
  }

  /* ---------- Header ---------- */
  .game-header {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    text-align: left;
    margin-bottom: 2.25rem;
  }

  .back-link-fixed {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 50;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-radius: var(--r-pill);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    color: var(--ink-dim);
    font-size: 0.84rem;
    font-weight: 600;
    text-decoration: none;
    transition:
      color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
      border-color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
      transform var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
      background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
  }

  .back-link-fixed:hover,
  .back-link-fixed:focus-visible {
    color: #fff;
    border-color: var(--line-strong);
    background: var(--glass-hover);
    transform: translateY(-2px);
    outline: none;
  }

  .back-link-fixed:focus-visible {
    outline: 2px solid rgba(224, 242, 254, 0.8);
    outline-offset: 3px;
  }

  .back-link-fixed svg { width: 14px; height: 14px; flex-shrink: 0; }

  .game-title {
    font-family: 'DM Serif Display', serif;
    font-weight: normal;
    font-size: 4.5rem;
    line-height: 1;
    letter-spacing: 0.01em;
    color: #fff;
    text-shadow: 0 0 60px rgba(120, 170, 255, 0.28);
    opacity: 0;
    animation: fade-in 700ms ease-out 80ms forwards;
  }

  .game-subline {
    margin-top: 0.85rem;
    font-size: 0.95rem;
    color: var(--ink-dim);
    opacity: 0;
    animation: fade-in 700ms ease-out 200ms forwards;
  }

  .header-rule {
    height: 1px;
    width: 100%;
    max-width: 1040px;
    margin-top: 1.75rem;
    transform: scaleX(0);
    transform-origin: center center;
    background: linear-gradient(
      90deg,
      rgba(190, 215, 255, 0) 0%,
      rgba(190, 215, 255, 0.35) 12%,
      rgba(214, 232, 255, 0.72) 50%,
      rgba(190, 215, 255, 0.35) 88%,
      rgba(190, 215, 255, 0) 100%
    );
    opacity: 0.75;
    animation: rule-draw 900ms cubic-bezier(0.22, 1, 0.36, 1) 320ms forwards;
  }

  /* ---------- Game surface ---------- */
  .game-shell {
    position: relative;
    width: 100%;
    max-width: 1040px;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 1.25rem;
    opacity: 0;
    animation: card-in 600ms cubic-bezier(0.22, 1, 0.36, 1) 420ms forwards;
  }

  /* ---------- Minesweeper HUD ---------- */
  .ms-hud {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    margin-bottom: 1rem;
    padding: 0.55rem 0.75rem;
    border-radius: var(--r-pill);
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.03);
    box-shadow: var(--glass-inset);
  }

  .ms-hud-group {
    display: flex;
    align-items: center;
    gap: 0.55rem;
  }

  .ms-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    padding: 0.42rem 0.85rem;
    border-radius: var(--r-pill);
    border: 1px solid var(--line);
    background: rgba(3, 5, 20, 0.55);
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: rgba(226, 240, 255, 0.9);
    min-width: 78px;
    justify-content: center;
    font-variant-numeric: tabular-nums;
  }

  .ms-chip svg {
    width: 15px;
    height: 15px;
    color: #fb7185;
    flex-shrink: 0;
  }

  .ms-chip.flag-chip svg { color: #fb923c; }
  .ms-chip.time-chip svg { color: #4cc9f0; }

  .ms-reset {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    box-shadow: var(--glass-inset);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: #cfe3ff;
    transition:
      border-color var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
      transform var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
      background var(--nav-hover-transition-duration) var(--nav-hover-transition-timing),
      box-shadow var(--nav-hover-transition-duration) var(--nav-hover-transition-timing);
    padding: 0;
    font: inherit;
  }

  .ms-reset:hover,
  .ms-reset:focus-visible {
    border-color: var(--line-strong);
    background: rgba(255, 255, 255, 0.08);
    transform: translateY(-2px) scale(1.03);
    box-shadow: var(--glass-inset), 0 12px 26px -14px rgba(190, 215, 255, 0.6);
    outline: none;
  }

  .ms-reset:focus-visible {
    outline: 2px solid rgba(224, 242, 254, 0.8);
    outline-offset: 3px;
  }

  .ms-reset svg { width: 22px; height: 22px; }

  .ms-reset[data-state="won"] svg { color: #34d399; }
  .ms-reset[data-state="lost"] svg { color: #fb7185; }

  /* Flag mode toggle (for touch) */
  .ms-mode {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.42rem 0.85rem;
    border-radius: var(--r-pill);
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    cursor: pointer;
    font: inherit;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-dim);
    transition:
      border-color 200ms ease,
      background 200ms ease,
      color 200ms ease,
      transform 200ms ease;
  }

  .ms-mode:hover {
    border-color: var(--line-strong);
    color: #fff;
    transform: translateY(-1px);
  }

  .ms-mode svg { width: 14px; height: 14px; }

  .ms-mode.is-active {
    border-color: rgba(251, 146, 60, 0.65);
    background: rgba(251, 146, 60, 0.16);
    color: #fff;
    box-shadow:
      0 0 0 3px rgba(251, 146, 60, 0.12),
      inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }

  /* ---------- Board ---------- */
  .board-wrap {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0.4rem;
    border-radius: 14px;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(20, 30, 80, 0.55), rgba(2, 4, 16, 0.85));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    overflow: hidden;
    transition: box-shadow 220ms ease;
  }

  /* ---------- Fullscreen button ---------- */
  .fullscreen-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    z-index: 5;
    width: 36px;
    height: 36px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(9, 13, 38, 0.72);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink-dim);
    transition:
      border-color 200ms ease,
      background 200ms ease,
      color 200ms ease,
      transform 200ms ease;
    padding: 0;
    font: inherit;
  }

  .fullscreen-btn:hover,
  .fullscreen-btn:focus-visible {
    border-color: var(--line-strong);
    background: rgba(13, 19, 50, 0.82);
    color: #fff;
    transform: translateY(-1px);
    outline: none;
  }

  .fullscreen-btn:focus-visible {
    outline: 2px solid rgba(224, 242, 254, 0.8);
    outline-offset: 2px;
  }

  .fullscreen-btn svg {
    width: 18px;
    height: 18px;
  }

  .board-wrap.is-shaking {
    animation: board-shake 480ms cubic-bezier(0.36, 0.07, 0.19, 0.97);
  }

  .board {
    display: grid;
    gap: 3px;
    padding: 6px;
    width: 100%;
    max-width: 100%;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  .cell {
    position: relative;
    aspect-ratio: 1;
    border-radius: 6px;
    border: 1px solid rgba(224, 242, 254, 0.09);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.02));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.09),
      inset 0 -1px 0 rgba(0, 0, 0, 0.28);
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: clamp(0.65rem, 1.6cqw, 1.05rem);
    color: transparent;
    cursor: pointer;
    transition:
      background 180ms ease,
      border-color 180ms ease,
      transform 180ms ease,
      box-shadow 180ms ease,
      color 180ms ease;
    will-change: transform, background;
    font-variant-numeric: tabular-nums;
  }

  .board-wrap { container-type: inline-size; }

  .cell:hover:not(.revealed):not(.flagged) {
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.13), rgba(255, 255, 255, 0.04));
    border-color: rgba(224, 242, 254, 0.22);
    transform: translateY(-1px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.16),
      0 6px 14px -8px rgba(0, 0, 0, 0.9);
  }

  .cell:active:not(.revealed):not(.flagged) {
    transform: translateY(0) scale(0.96);
  }

  /* Revealed */
  .cell.revealed {
    background: rgba(2, 5, 18, 0.62);
    border-color: rgba(224, 242, 254, 0.05);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.03),
      inset 0 0 0 1px rgba(0, 0, 0, 0.25);
    cursor: default;
    color: var(--ink);
    transform: none;
  }

  .cell.revealed.adj-0 { color: transparent; }

  .cell.revealed.adj-1 { color: var(--n1); text-shadow: 0 0 12px rgba(76, 201, 240, 0.55); }
  .cell.revealed.adj-2 { color: var(--n2); text-shadow: 0 0 12px rgba(52, 211, 153, 0.5); }
  .cell.revealed.adj-3 { color: var(--n3); text-shadow: 0 0 12px rgba(251, 113, 133, 0.55); }
  .cell.revealed.adj-4 { color: var(--n4); text-shadow: 0 0 12px rgba(167, 139, 250, 0.55); }
  .cell.revealed.adj-5 { color: var(--n5); text-shadow: 0 0 12px rgba(251, 146, 60, 0.55); }
  .cell.revealed.adj-6 { color: var(--n6); text-shadow: 0 0 12px rgba(34, 211, 238, 0.55); }
  .cell.revealed.adj-7 { color: var(--n7); text-shadow: 0 0 12px rgba(244, 114, 182, 0.55); }
  .cell.revealed.adj-8 { color: var(--n8); text-shadow: 0 0 12px rgba(226, 232, 240, 0.55); }

  /* Reveal pop animation */
  .cell.revealed {
    animation: cell-pop 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes cell-pop {
    0%   { transform: scale(0.88); background: rgba(190, 215, 255, 0.16); }
    60%  { transform: scale(1.02); }
    100% { transform: scale(1); }
  }

  /* Flag */
  .cell.flagged {
    background: linear-gradient(180deg, rgba(251, 146, 60, 0.14), rgba(251, 146, 60, 0.03));
    border-color: rgba(251, 146, 60, 0.35);
    cursor: pointer;
    animation: flag-in 220ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  @keyframes flag-in {
    0%   { transform: scale(0.5) rotate(-14deg); opacity: 0; }
    60%  { transform: scale(1.1) rotate(4deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); }
  }

  .cell.flagged::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fb923c' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 21V4'/><path d='M5 5h11l-2 4 2 4H5'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 68% 68%;
    filter: drop-shadow(0 0 6px rgba(251, 146, 60, 0.65));
  }

  /* Mine */
  .cell.mine::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fb7185' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><circle cx='12' cy='13' r='5.2' fill='%23fb7185' fill-opacity='0.15'/><path d='M12 2.4v3M12 20.6v1M2.4 13h3M18.6 13h3M5.5 6.5 4.1 5.1M18.5 6.5l1.4-1.4M5.5 19.5l-1.4 1.4M18.5 19.5l1.4 1.4'/></svg>");
    background-repeat: no-repeat;
    background-position: center;
    background-size: 82% 82%;
    filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.8));
  }

  .cell.revealed.mine {
    background: rgba(120, 20, 40, 0.42);
    border-color: rgba(251, 113, 133, 0.5);
  }

  .cell.flagged.mine::before {
    /* wrong flag on loss */
    content: "";
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23fb7185' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M5 21V4'/><path d='M5 5h11l-2 4 2 4H5'/><path d='M3 3l18 18' stroke-width='2.4'/></svg>");
  }

  /* EXPLOSION */
  .cell.exploding {
    z-index: 5;
    background: radial-gradient(circle, #ffb199 0%, #fb7185 35%, #7f1d1d 100%);
    border-color: rgba(255, 200, 200, 0.9);
    animation: mine-boom 640ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    box-shadow:
      0 0 0 0 rgba(251, 113, 133, 0.9),
      0 0 40px 12px rgba(251, 113, 133, 0.7);
  }

  .cell.exploding::before {
    filter: drop-shadow(0 0 16px #fff);
    animation: mine-glow 640ms ease-out forwards;
  }

  .cell.exploding::after {
    content: "";
    position: absolute;
    inset: -40%;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 240, 200, 0.95) 0%,
      rgba(251, 146, 60, 0.65) 30%,
      rgba(251, 113, 133, 0.35) 55%,
      rgba(251, 113, 133, 0) 78%);
    animation: boom-ring 720ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    pointer-events: none;
    z-index: -1;
  }

  @keyframes mine-boom {
    0%   { transform: scale(1); }
    18%  { transform: scale(1.45); filter: brightness(2.4); }
    42%  { transform: scale(1.2);  filter: brightness(1.6); }
    100% { transform: scale(1);    filter: brightness(1); }
  }

  @keyframes mine-glow {
    0%   { filter: drop-shadow(0 0 12px #fff) brightness(1); }
    30%  { filter: drop-shadow(0 0 26px #fff) brightness(2.5); }
    100% { filter: drop-shadow(0 0 8px #fb7185) brightness(1); }
  }

  @keyframes boom-ring {
    0%   { transform: scale(0.15); opacity: 1; }
    55%  { opacity: 0.65; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  /* Particles */
  .particle-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 7;
    overflow: visible;
  }

  .particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff 0%, #fca5a5 40%, #fb7185 75%, rgba(251, 113, 133, 0) 100%);
    transform: translate(-50%, -50%);
    animation: particle-fly 780ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    box-shadow: 0 0 10px rgba(251, 146, 60, 0.85);
  }

  .particle.warm {
    background: radial-gradient(circle, #fff 0%, #fde68a 40%, #fb923c 75%, rgba(251, 146, 60, 0) 100%);
    box-shadow: 0 0 12px rgba(251, 146, 60, 0.9);
  }

  @keyframes particle-fly {
    0%   { transform: translate(-50%, -50%) scale(1);   opacity: 1; }
    60%  { opacity: 0.9; }
    100% { transform: translate(calc(-50% + var(--px)), calc(-50% + var(--py))) scale(0.3); opacity: 0; }
  }

  /* Vignette flash on loss */
  .vignette-flash {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 6;
    border-radius: 12px;
    background: radial-gradient(circle at center,
      rgba(251, 113, 133, 0) 30%,
      rgba(251, 113, 133, 0.45) 80%,
      rgba(120, 15, 35, 0.75) 100%);
    opacity: 0;
    animation: vignette 900ms ease-out forwards;
  }

  @keyframes vignette {
    0%   { opacity: 0; }
    12%  { opacity: 1; }
    55%  { opacity: 0.45; }
    100% { opacity: 0; }
  }

  /* ---------- Overlays ---------- */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: flex;
    flex-direction: column;
    background: rgba(3, 5, 20, 0.78);
    backdrop-filter: blur(22px) saturate(150%);
    -webkit-backdrop-filter: blur(22px) saturate(150%);
    border-radius: var(--r-panel);
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 240ms ease;
  }

  .overlay.is-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .overlay-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1.5rem 0.85rem;
    scrollbar-width: thin;
    scrollbar-color: rgba(224, 242, 254, 0.18) transparent;
  }

  .overlay-scroll::-webkit-scrollbar { width: 6px; }
  .overlay-scroll::-webkit-scrollbar-thumb {
    background: rgba(224, 242, 254, 0.16);
    border-radius: 3px;
  }

  .overlay-head { margin-bottom: 1.2rem; }

  .overlay h2 {
    font-family: 'DM Serif Display', serif;
    font-weight: normal;
    font-size: 1.8rem;
    line-height: 1.1;
    color: #fff;
    margin-bottom: 0.25rem;
  }

  .overlay-sub {
    color: var(--ink-dim);
    font-size: 0.85rem;
  }

  /* Difficulty selector */
  .diff-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.7rem;
  }

  .diff-btn {
    appearance: none;
    font: inherit;
    cursor: pointer;
    padding: 0.9rem 0.6rem 0.75rem;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.035);
    color: var(--ink-dim);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.55rem;
    transition:
      border-color 220ms ease,
      background 220ms ease,
      transform 220ms ease,
      box-shadow 220ms ease,
      color 220ms ease;
  }

  .diff-btn:hover {
    border-color: var(--line-strong);

    color: #fff;
    transform: translateY(-2px);
  }

  .diff-btn.is-active {

  /* Overlay actions */
  .overlay-actions {

    font-weight: 600;

    padding: 0.68rem 1.6rem;
    border-radius: 999px;
    cursor: pointer;
    transition:
      border-color 200ms ease,
      background 200ms ease,
      transform 200ms ease,
      box-shadow 200ms ease,
      color 200ms ease;

  }

  .btn-primary {
    border: 1px solid rgba(190, 215, 255, 0.45);
    background: linear-gradient(180deg, rgba(190, 215, 255, 0.22), rgba(190, 215, 255, 0.08));

  /* End game overlay */
  .end-content {
    flex: 1;
    display: flex;
    flex-direction: column;

    align-items: center;

    text-align: center;
    gap: 0.35rem;
  }

  .end-icon {
    width: 66px;
    height: 66px;
    margin-bottom: 0.5rem;

  .end-icon.win svg { color: #34d399; filter: drop-shadow(0 0 14px rgba(52, 211, 153, 0.7)); }
  .end-icon.lose svg { color: #fb7185; filter: drop-shadow(0 0 14px rgba(251, 113, 133, 0.7)); }

    font-size: 2.3rem;

  .end-stats {
    display: flex;
    gap: 1.5rem;

    display: block;

    font-size: 0.78rem;
    color: rgba(226, 240, 255, 0.5);
    margin-top: 0.6rem;

  /* ---------- Footer ---------- */
  .game-footer {
    margin-top: 2rem;
    font-size: 0.8rem;
    color: var(--ink-dim);
    text-align: center;
    opacity: 0;
    animation: fade-in 700ms ease-out 620ms forwards;
  }

  /* ---------- Animations ---------- */
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes card-in {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes rule-draw {
    from { transform: scaleX(0); }
    to   { transform: scaleX(1); }
  }

  @keyframes board-shake {
    0%, 100% { transform: translate(0, 0); }
    12%      { transform: translate(-6px, 3px); }
    25%      { transform: translate(5px, -3px); }
    38%      { transform: translate(-4px, 2px); }
    52%      { transform: translate(3px, -2px); }
    68%      { transform: translate(-2px, 1px); }
    84%      { transform: translate(1px, -1px); }
  }

  @media (prefers-reduced-motion: reduce) {
    .game-title,
    .game-subline,
    .header-rule,
    .game-shell,
    .game-footer {
      animation: none !important;
      opacity: 1;
      transform: none;

    .back-link,
    .cell,
    .ms-reset,
    .ms-mode,
    .diff-btn,
    .btn-primary,
    .btn-ghost,
    .overlay {

    .cell.exploding,
    .cell.exploding::after,
    .cell.exploding::before,
    .board-wrap.is-shaking,
    .particle,

    .game-title { font-size: 2.75rem; }
    .game-shell { padding: 0.85rem; }

  /* =========================================================

<script>
/* =========================================================
   1. STARFIELD (identical to DUB5 launcher)
   ========================================================= */
(function starfield() {
  const canvas = document.getElementById('stars');
  if (!canvas) return;

  const ctx = canvas.getContext('2d', { alpha: true });
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const TINTS = [
    [255, 255, 255],
    [205, 222, 255],
    [255, 236, 214],
    [186, 205, 255]
  ];
  const BASE_SIZE = [1.8, 3.2, 6.4, 11];

  const spriteCache = new Map();
  let flareSprite = null;

  let W = 0, H = 0, dpr = 1;
  let stars = [];
  let shooting = null;
  let nextShot = 3200;
  let mouseX = 0, mouseY = 0, targetX = 0, targetY = 0;
  let lastT = performance.now();
  let rafId = null;

  function getSprite(tint, bucket) {
    const key = tint + ':' + bucket;
    const cached = spriteCache.get(key);
    if (cached) return cached;

    const radius = [1.5, 2.6, 4.6, 7.4][bucket];
    const size = Math.max(2, Math.ceil(radius * 2));
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g = c.getContext('2d');
    const t = TINTS[tint];
    const cx = size / 2;

    const grad = g.createRadialGradient(cx, cx, 0, cx, cx, cx);
    grad.addColorStop(0.00, 'rgba(255,255,255,1)');
    grad.addColorStop(0.14, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.80)');
    grad.addColorStop(0.38, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.20)');
    grad.addColorStop(0.72, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0.04)');
    grad.addColorStop(1.00, 'rgba(' + t[0] + ',' + t[1] + ',' + t[2] + ',0)');

    g.fillStyle = grad;
    g.beginPath(); g.arc(cx, cx, cx, 0, Math.PI * 2); g.fill();

    g.fillStyle = 'rgba(255,255,255,0.95)';
    g.beginPath(); g.arc(cx, cx, Math.max(0.4, cx * 0.15), 0, Math.PI * 2); g.fill();

    spriteCache.set(key, c);
    return c;
  }

  function getFlare() {
    if (flareSprite) return flareSprite;
    const s = 64;
    const c = document.createElement('canvas');
    c.width = s; c.height = s;
    const g = c.getContext('2d');
    const mid = s / 2;

    const h = g.createLinearGradient(0, mid, s, mid);
    h.addColorStop(0, 'rgba(255,255,255,0)');
    h.addColorStop(0.5, 'rgba(255,255,255,0.8)');
    h.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = h; g.fillRect(0, mid - 0.55, s, 1.1);

    const v = g.createLinearGradient(mid, 0, mid, s);
    v.addColorStop(0, 'rgba(255,255,255,0)');
    v.addColorStop(0.5, 'rgba(255,255,255,0.8)');
    v.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = v; g.fillRect(mid - 0.55, 0, 1.1, s);

    flareSprite = c;
    return c;
  }

  function build() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const density = Math.round((W * H) / 1500);
    const count = Math.min(1500, Math.max(420, density));

    stars = [];
    for (let i = 0; i < count; i++) {
      const roll = Math.random();
      let bucket = 0;
      if (roll > 0.9955) bucket = 3;
      else if (roll > 0.972) bucket = 2;
      else if (roll > 0.85) bucket = 1;

      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        depth: 0.25 + Math.random() * 0.75,
        bucket: bucket,
        tint: [0, 0, 0, 1, 3, 2][Math.floor(Math.random() * 6)],
        base: 0.28 + Math.random() * 0.62,
        speed: 0.35 + Math.random() * 1.5,
        phase: Math.random() * Math.PI * 2,
        angle: Math.random() * Math.PI,
        hasFlare: bucket === 3
      });
    }
  }

  function spawnShooting() {
    const goLeft = Math.random() > 0.5;
    const speed = 380 + Math.random() * 320;
    shooting = {
      x: W * (0.15 + Math.random() * 0.7),
      y: H * (0.05 + Math.random() * 0.35),
      vx: (goLeft ? -1 : 1) * speed * 0.85,
      vy: speed * 0.45,
      life: 0,
      max: 0.9 + Math.random() * 0.5
    };
  }

  function draw(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    ctx.clearRect(0, 0, W, H);
    mouseX += (targetX - mouseX) * 0.045;
    mouseY += (targetY - mouseY) * 0.045;
    const px = mouseX * 16, py = mouseY * 16;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const twinkle = 0.7 + 0.3 * Math.sin(t * s.speed + s.phase);
      const alpha = Math.min(1, s.base * twinkle);
      const size = BASE_SIZE[s.bucket] * (0.6 + s.depth * 0.8);
      const x = s.x + px * s.depth;
      const y = s.y + py * s.depth;

      ctx.globalAlpha = alpha;
      ctx.drawImage(getSprite(s.tint, s.bucket), x - size / 2, y - size / 2, size, size);

      if (s.hasFlare) {
        const fs = size * 6;
        ctx.globalAlpha = alpha * 0.3;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(s.angle);
        ctx.drawImage(getFlare(), -fs / 2, -fs / 2, fs, fs);
        ctx.restore();
      }
    }
    ctx.globalAlpha = 1;

    if (!reduceMotion) {
      if (!shooting) {
        nextShot -= dt * 1000;
        if (nextShot <= 0) { spawnShooting(); nextShot = 7000 + Math.random() * 12000; }
      } else {
        const p = shooting;
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life += dt;

        const tailX = p.x - p.vx * 0.13;
        const tailY = p.y - p.vy * 0.13;
        const fade = Math.max(0, 1 - p.life / p.max);

        const grad = ctx.createLinearGradient(p.x, p.y, tailX, tailY);
        grad.addColorStop(0, 'rgba(255,255,255,0.95)');
        grad.addColorStop(0.35, 'rgba(190,220,255,0.32)');
        grad.addColorStop(1, 'rgba(190,220,255,0)');

        ctx.globalAlpha = fade;
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(tailX, tailY);
        ctx.stroke();

        ctx.globalAlpha = fade * 0.85;
        ctx.drawImage(getSprite(0, 3), p.x - 8, p.y - 8, 16, 16);
        ctx.globalAlpha = 1;

        if (p.life > p.max || p.x < -300 || p.x > W + 300 || p.y > H + 300) shooting = null;
      }
    }
  }

  function loop(now) { draw(now); rafId = requestAnimationFrame(loop); }

  function start() {
    if (rafId !== null) cancelAnimationFrame(rafId);
    lastT = performance.now();
    if (reduceMotion) { draw(performance.now()); rafId = null; return; }
    rafId = requestAnimationFrame(loop);
  }

  function stop() {
    if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
  }

  let resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { build(); if (reduceMotion) draw(performance.now()); }, 140);
  });

  window.addEventListener('pointermove', function (e) {
    targetX = (e.clientX / W) * 2 - 1;
    targetY = (e.clientY / H) * 2 - 1;
  }, { passive: true });

  document.addEventListener('visibilitychange', function () {
    if (reduceMotion) return;
    if (document.hidden) stop(); else start();
  });

  build();
  start();
})();


/* =========================================================
   2. DIFFICULTY DEFINITIONS
   ========================================================= */
const DIFFICULTIES = {
  easy:   { label: 'Makkelijk', cols: 9,  rows: 9,  mines: 10, key: 'easy'   },
  medium: { label: 'Gemiddeld', cols: 14, rows: 10, mines: 25, key: 'medium' },
  hard:   { label: 'Moeilijk',  cols: 18, rows: 14, mines: 48, key: 'hard'   }
};


/* =========================================================
   3. DIFFICULTY PREVIEW SVG
   ========================================================= */
function diffPreviewSVG(cols, rows, mines) {
  const W = 76, H = 56;
  const cw = W / cols;
  const ch = H / rows;

  let s = '<svg class="diff-preview" viewBox="0 0 ' + W + ' ' + H + '" fill="none">';

  // Cells
  for (let x = 0; x < cols; x++) {
    for (let y = 0; y < rows; y++) {
      s += '<rect x="' + (x*cw + 0.4).toFixed(2) + '" y="' + (y*ch + 0.4).toFixed(2) +
           '" width="' + (cw - 0.8).toFixed(2) + '" height="' + (ch - 0.8).toFixed(2) +
           '" rx="1" fill="rgba(190,215,255,0.12)" stroke="rgba(190,215,255,0.22)" stroke-width="0.4"/>';
    }
  }

  // Sprinkle mines as small dots
  let placed = 0;
  const occupied = new Set();
  let attempts = 0;
  while (placed < Math.min(mines, 8) && attempts < 60) {
    attempts++;
    const mx = Math.floor(Math.random() * cols);
    const my = Math.floor(Math.random() * rows);
    const k = mx + ',' + my;
    if (occupied.has(k)) continue;
    occupied.add(k);
    const cxm = (mx + 0.5) * cw;
    const cym = (my + 0.5) * ch;
    s += '<circle cx="' + cxm.toFixed(2) + '" cy="' + cym.toFixed(2) +
         '" r="' + (Math.min(cw, ch) * 0.28).toFixed(2) + '" fill="#fb7185" opacity="0.85"/>';
    placed++;
  }

  s += '</svg>';
  return s;
}

/* =========================================================
   6. BOARD BUILDING
   ========================================================= */
function neighbours(idx) {
  const c = idx % game.cols;
  const r = Math.floor(idx / game.cols);
  const out = [];
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      if (dr === 0 && dc === 0) continue;
      const nr = r + dr, nc = c + dc;
      if (nr < 0 || nr >= game.rows || nc < 0 || nc >= game.cols) continue;
      out.push(nr * game.cols + nc);
    }
  }
  return out;
}

function buildBoard() {
  const d = DIFFICULTIES[game.key];
  game.cols = d.cols;
  game.rows = d.rows;
  game.totalMines = d.mines;
  game.totalSafe = game.cols * game.rows - game.totalMines;
  game.board = new Array(game.cols * game.rows).fill(null).map(function () {
    return { mine: false, revealed: false, flagged: false, adjacent: 0 };
  });
  game.cellEls = [];
  game.flagCount = 0;
  game.revealedSafe = 0;
  game.started = false;
  game.ended = false;

  boardEl.innerHTML = '';
  boardEl.style.gridTemplateColumns = 'repeat(' + game.cols + ', 1fr)';
  boardEl.style.maxWidth = Math.min(1000, game.cols * 42) + 'px';

  for (let i = 0; i < game.cols * game.rows; i++) {
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'cell';
    cell.dataset.idx = String(i);
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('aria-label', 'Vakje');

    cell.addEventListener('click', onCellClick);
    cell.addEventListener('contextmenu', onCellContext);
    cell.addEventListener('auxclick', onCellAux);
    cell.addEventListener('touchstart', onTouchStart, { passive: true });
    cell.addEventListener('touchend', onTouchEnd);

    boardEl.appendChild(cell);
    game.cellEls.push(cell);
  }

  updateMineCounter();
  updateTimer(0);
}

function placeMines(safeIdx) {
  const forbid = new Set();
  forbid.add(safeIdx);
  neighbours(safeIdx).forEach(function (n) { forbid.add(n); });

  const available = [];
  for (let i = 0; i < game.board.length; i++) {
    if (!forbid.has(i)) available.push(i);
  }

  // shuffle
  for (let i = available.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = available[i]; available[i] = available[j]; available[j] = t;
  }

  const count = Math.min(game.totalMines, available.length);
  for (let i = 0; i < count; i++) {
    game.board[available[i]].mine = true;
  }

  // compute adjacents
  for (let i = 0; i < game.board.length; i++) {
    if (game.board[i].mine) continue;
    let n = 0;
    for (const j of neighbours(i)) if (game.board[j].mine) n++;
    game.board[i].adjacent = n;
  }
}


/* =========================================================
   7. HUD HELPERS
   ========================================================= */
function updateMineCounter() {
  const remaining = game.totalMines - game.flagCount;
  mineCountEl.textContent = String(remaining);
}

function updateTimer(seconds) {
  timeCountEl.textContent = String(Math.min(999, Math.floor(seconds)));
}

function startTimer() {
  if (game.timerId !== null) return;
  game.startTime = performance.now();
  game.timerId = setInterval(function () {
    const s = (performance.now() - game.startTime) / 1000;
    updateTimer(s);
  }, 250);
}

function stopTimer() {
  if (game.timerId !== null) {
    clearInterval(game.timerId);
    game.timerId = null;
  }
}

function currentElapsedSeconds() {
  if (!game.started) return 0;
  return (performance.now() - game.startTime) / 1000;
}


/* =========================================================
   8. REVEAL LOGIC
   ========================================================= */
function revealCell(idx, opts) {
  opts = opts || {};
  if (game.ended) return;
  const cell = game.board[idx];
  if (!cell || cell.revealed || cell.flagged) return;

  if (!game.started) {
    placeMines(idx);
    game.started = true;
    game.phase = 'playing';
    startTimer();
  }

  if (cell.mine) {
    triggerExplosion(idx);
    return;
  }

  // BFS reveal
  const queue = [idx];
  const visited = new Set([idx]);
  const order = [];

  while (queue.length) {
    const i = queue.shift();
    const c = game.board[i];
    if (c.revealed || c.flagged || c.mine) continue;
    c.revealed = true;
    game.revealedSafe++;
    order.push(i);

    if (c.adjacent === 0) {
      for (const n of neighbours(i)) {
        const nc = game.board[n];
        if (!visited.has(n) && !nc.revealed && !nc.flagged && !nc.mine) {
          visited.add(n);
          queue.push(n);
        }
      }
    }
  }

  // Apply visuals with staggered reveal animation
  order.forEach(function (i, k) {
    const el = game.cellEls[i];
    const b = game.board[i];

    setTimeout(function () {
      el.classList.add('revealed');
      if (b.adjacent > 0) {
        el.classList.add('adj-' + b.adjacent);
        el.textContent = String(b.adjacent);
      } else {
        el.classList.add('adj-0');
        el.textContent = '';
      }
    }, k * 22);
  });

  // Check win (some cells might still be pending, so delay the check)
  setTimeout(checkWin, order.length * 22 + 40);
}


function checkWin() {
  if (game.ended) return;
  if (game.revealedSafe >= game.totalSafe) {
    winGame();
  }
}


/* =========================================================
   9. EXPLOSION
   ========================================================= */
function triggerExplosion(hitIdx) {
  if (game.ended) return;
  game.ended = true;
  game.phase = 'over';
  stopTimer();

  // 1. Mark the hit cell
  const hitCell = game.board[hitIdx];
  hitCell.revealed = true;

  // Collect all mine cells (excluding flagged) for chain reveal
  const mineIndices = [];
  for (let i = 0; i < game.board.length; i++) {
    if (game.board[i].mine) mineIndices.push(i);
  }

  // Reveal all mines with a stagger — closest to hit first
  const hitCol = hitIdx % game.cols;
  const hitRow = Math.floor(hitIdx / game.cols);

  mineIndices.sort(function (a, b) {
    const ac = a % game.cols, ar = Math.floor(a / game.cols);
    const bc = b % game.cols, br = Math.floor(b / game.cols);
    const da = Math.hypot(ac - hitCol, ar - hitRow);
    const db = Math.hypot(bc - hitCol, br - hitRow);
    return da - db;
  });

  // Board shake + vignette
  boardWrap.classList.add('is-shaking');
  setTimeout(function () { boardWrap.classList.remove('is-shaking'); }, 520);

  const vig = document.createElement('div');
  vig.className = 'vignette-flash';
  boardWrap.appendChild(vig);
  setTimeout(function () { vig.remove(); }, 1000);

  // 2. First: the hit cell explodes immediately with particles
  explodeAt(hitIdx, true);

  // 3. Chain: remaining mines explode with increasing delay
  let delay = 140;
  for (let i = 0; i < mineIndices.length; i++) {
    const mi = mineIndices[i];
    if (mi === hitIdx) continue;
    const d = Math.hypot((mi % game.cols) - hitCol, Math.floor(mi / game.cols) - hitRow);
    const localDelay = delay + d * 55 + Math.random() * 60;
    setTimeout(function () { explodeAt(mi, false); }, localDelay);
    delay += 18;
  }

  // 4. Wrong flags: mark after a beat
  setTimeout(function () {
    for (let i = 0; i < game.board.length; i++) {
      const b = game.board[i];
      if (b.flagged && !b.mine) {
        const el = game.cellEls[i];
        el.classList.add('revealed', 'mine');
      }
    }
  }, 900 + Math.random() * 200);

  // 5. Show overlay after the show
  setTimeout(showLoseOverlay, 1600);

  // Reset smiley
  document.getElementById('resetBtn').dataset.state = 'lost';
}


function explodeAt(idx, isMain) {
  const el = game.cellEls[idx];
  const b = game.board[idx];
  if (!el) return;

  // Reveal the mine
  el.classList.add('revealed', 'mine');
  b.revealed = true;

  // Add explosive class
  el.classList.add('exploding');

  // Spawn particles
  spawnParticles(idx, isMain ? 22 : 12, isMain);

  // Remove explosive class after animation completes
  setTimeout(function () { el.classList.remove('exploding'); }, 700);
}


function spawnParticles(idx, count, warm) {
  const el = game.cellEls[idx];
  if (!el) return;

  const rect = el.getBoundingClientRect();
  const wrapRect = boardWrap.getBoundingClientRect();

  const cx = rect.left - wrapRect.left + rect.width / 2;
  const cy = rect.top - wrapRect.top + rect.height / 2;

  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle' + (warm ? ' warm' : '');

    const angle = Math.random() * Math.PI * 2;
    const distance = 40 + Math.random() * (warm ? 90 : 60);
    const px = Math.cos(angle) * distance;
    const py = Math.sin(angle) * distance;

    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--px', px.toFixed(1) + 'px');
    p.style.setProperty('--py', py.toFixed(1) + 'px');

    const scale = 0.6 + Math.random() * 1.1;
    p.style.width = (5 * scale).toFixed(1) + 'px';
    p.style.height = (5 * scale).toFixed(1) + 'px';

    // Slight delay per particle
    p.style.animationDelay = (Math.random() * 60) + 'ms';

    particleLayer.appendChild(p);

    setTimeout(function () { p.remove(); }, 1000);
  }
}


function showLoseOverlay() {
  const elapsed = currentElapsedSeconds();
  document.getElementById('endIcon').className = 'end-icon lose';
  document.getElementById('endIcon').innerHTML =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +

    '<path d="M12 2.4v3M12 20.6v1M2.4 13h3M18.6 13h3M5.5 6.5 4.1 5.1M18.5 6.5l1.4-1.4M5.5 19.5l-1.4 1.4M18.5 19.5l1.4 1.4"/>' +
    '</svg>';
  document.getElementById('endTitle').textContent = 'Boom!';
  document.getElementById('endSub').textContent = 'Je raakte een mijn. Probeer het opnieuw.';
  document.getElementById('endTime').textContent = elapsed.toFixed(1) + 's';
  const best = bestTimes[game.key];
  document.getElementById('endBest').textContent = best ? best.toFixed(1) + 's' : '—';
  document.getElementById('endRecord').textContent = '';

}


/* =========================================================
   10. WIN
   ========================================================= */
function winGame() {
  if (game.ended) return;
  game.ended = true;
  game.phase = 'over';
  stopTimer();

  const elapsed = currentElapsedSeconds();

  // Auto-flag all mines with a nice pop
  let stagger = 0;
  for (let i = 0; i < game.board.length; i++) {
    const b = game.board[i];
    if (b.mine && !b.flagged) {
      const el = game.cellEls[i];
      setTimeout(function () { el.classList.add('flagged'); }, stagger);
      stagger += 40;
      b.flagged = true;
      game.flagCount++;
    }
  }
  updateMineCounter();

  // Save best time
  let newRecord = false;
  const prev = bestTimes[game.key];
  if (!prev || elapsed < prev) {
    bestTimes[game.key] = elapsed;
    saveBestTimes();
    newRecord = true;
  }

  document.getElementById('resetBtn').dataset.state = 'won';

  setTimeout(function () {
    document.getElementById('endIcon').className = 'end-icon win';
    document.getElementById('endIcon').innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    document.getElementById('endTitle').textContent = 'Gewonnen!';
    document.getElementById('endSub').textContent = 'Alle mijnen veilig gemarkeerd.';
    document.getElementById('endTime').textContent = elapsed.toFixed(1) + 's';
    document.getElementById('endBest').textContent = bestTimes[game.key].toFixed(1) + 's';
    document.getElementById('endRecord').textContent = newRecord ? '★ Nieuw record!' : '';
    showOverlay('endOverlay', true);
  }, stagger + 300);
}


/* =========================================================
   11. INPUT
   ========================================================= */
let longPressTimer = null;
let longPressFired = false;
let touchStartIdx = -1;

function onCellClick(e) {
  const idx = parseInt(e.currentTarget.dataset.idx, 10);
  const b = game.board[idx];
  if (!b || game.ended) return;

  // If touch-triggered flag just fired, skip this click
  if (longPressFired) { longPressFired = false; return; }

  if (game.flagMode || b.flagged) {
    toggleFlag(idx);
    return;
  }

  if (b.revealed && b.adjacent > 0) {
    tryChord(idx);
    return;
  }

  if (!b.revealed) {
    revealCell(idx);
  }
}

function onCellContext(e) {
  e.preventDefault();
  const idx = parseInt(e.currentTarget.dataset.idx, 10);
  const b = game.board[idx];
  if (!b || game.ended || b.revealed) return;
  toggleFlag(idx);
}

function onCellAux(e) {
  // Middle-click chord
  if (e.button !== 1) return;
  e.preventDefault();
  const idx = parseInt(e.currentTarget.dataset.idx, 10);
  const b = game.board[idx];
  if (!b || game.ended) return;
  if (b.revealed && b.adjacent > 0) tryChord(idx);
}

function onTouchStart(e) {
  const idx = parseInt(e.currentTarget.dataset.idx, 10);
  touchStartIdx = idx;
  longPressFired = false;
  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(function () {
    longPressFired = true;
    const b = game.board[idx];
    if (!b || game.ended || b.revealed) return;
    toggleFlag(idx);
    if (navigator.vibrate) navigator.vibrate(15);
  }, 420);
}

function onTouchEnd(e) {
  clearTimeout(longPressTimer);
}

function toggleFlag(idx) {
  const b = game.board[idx];
  if (!b || game.ended || b.revealed) return;

  if (!game.started) {
    // First action: place mines now using the flag cell as safe anchor
    placeMines(idx);
    game.started = true;
    game.phase = 'playing';
    startTimer();
  }

  b.flagged = !b.flagged;
  const el = game.cellEls[idx];
  if (b.flagged) {
    el.classList.add('flagged');
    game.flagCount++;
  } else {
    el.classList.remove('flagged');
    game.flagCount--;
  }
  updateMineCounter();
}

function tryChord(idx) {
  const b = game.board[idx];
  if (!b.revealed || b.adjacent === 0) return;

  let flagsAround = 0;
  const hidden = [];
  for (const n of neighbours(idx)) {
    const nb = game.board[n];
    if (nb.flagged) flagsAround++;
    else if (!nb.revealed) hidden.push(n);
  }

  if (flagsAround !== b.adjacent) return;

  // Reveal all non-flagged hidden neighbours
  for (const n of hidden) {
    revealCell(n);
  }
}

game.key = selectedDifficulty;
buildBoard();
showOverlay('settingsOverlay', true);

/* =========================================================
   FULLSCREEN
   ========================================================= */
const fullscreenBtn = document.getElementById('fullscreenBtn');
if (fullscreenBtn) {
  fullscreenBtn.addEventListener('click', function () {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(function (err) {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', function () {
    if (document.fullscreenElement) {
      fullscreenBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>';
    } else {
      fullscreenBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
    }
  });
}
// Topbar scroll effect
const topbar = document.getElementById('topbar');
if (topbar) {
  let ticking = false;
  function update() {
    const y = window.scrollY || window.pageYOffset || 0;
    topbar.classList.toggle('is-scrolled', y > 24);
    ticking = false;
  }
  window.addEventListener('scroll', function () {
    if (!ticking) {
      ticking = true;
      requestAnimationFrame(update);
    }
  }, { passive: true });
  update();
}
</script>
