<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<base href="/stacktris/">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Stacktris - DUB5</title>
<meta name="theme-color" content="#0b1150" />
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../showcase/showcase.css">
<style>
  html, body {
    overflow: hidden;
    height: 100%;
  }

  .page {
    padding: 4rem 1rem 0.5rem;
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .page-header { margin-bottom: 0.5rem; }
  .page-title { font-size: 2.5rem; }
  .page-subline { font-size: 0.8rem; }
  .header-rule { margin-top: 0.5rem; margin-bottom: 0.75rem; }

  .game-shell {
    position: relative;
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
    border-radius: var(--r-panel);
    border: 1px solid var(--line);
    background: var(--glass);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset), var(--glass-shadow);
    padding: 0.5rem;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .game-stage {
    position: relative;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    background: #000;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    flex: 1;
    min-height: 0;
    aspect-ratio: 16 / 9;
  }

  #canvas_border {
    position: absolute;
    inset: 0;
  }

  #canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    background: #000;
  }

  <!-- Loading overlay */
  #play_content {
    position: absolute;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    color: #fff;
    font-family: 'DM Serif Display', serif;
    text-align: center;
    padding: 1rem;
    background: radial-gradient(120% 100% at 50% 0%, #0b1150 0%, #050833 55%, #01030f 100%);
    pointer-events: auto;
  }

  #play_content .cover {
    width: 96px;
    height: 96px;
    border-radius: 18px;
    box-shadow: var(--glass-inset), var(--glass-shadow);
  }

  #play_content .game-name {
    font-size: 2rem;
    color: #fff;
  }

  #play_content .game-author {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 0.8rem;
    color: var(--ink-dim);
  }

  #progress_or_play { width: min(280px, 70%); }
  #progress {
    width: 100%;
    height: 8px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.08);
    accent-color: #4cc9f0;
  }

  #gradient { display: none; }
  #webview_content { display: none; }

  /* Never block pointer input to the game canvas */
  #play_content,
  #gradient,
  #webview_content,
  #modal_parent {
    pointer-events: none;
  }

  .game-shell-header {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 0.5rem;
  }

  .fullscreen-btn {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: rgba(9, 13, 38, 0.72);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    box-shadow: var(--glass-inset);
    display: grid;
    place-items: center;
    cursor: pointer;
    color: var(--ink-dim);
    transition: all 200ms ease;
    padding: 0;
    font: inherit;
  }

  .fullscreen-btn:hover {
    color: #fff;
    border-color: var(--line-strong);
    background: var(--glass-hover);
  }

  .fullscreen-btn svg {
    width: 16px;
    height: 16px;
  }

  /* Modal (required by engine, kept hidden) */
  #modal_parent { display: none; }

  @media (max-width: 768px) {
    .page { padding: 0.75rem 0.5rem 0.25rem; }
    .page-title { font-size: 1.75rem; }
    .page-subline { font-size: 0.7rem; }
    .game-shell { padding: 0.4rem; }
  }
</style>
</head>
<body>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>
  <a class="back-link-fixed" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5"/>
      <path d="m12 19-7-7 7-7"/>
    </svg>
    Terug
  </a>

  <div class="page">
    <header class="page-header">
      <h1 class="page-title">Stacktris</h1>
      <p class="page-subline">Stapel blokken en houd het bord opgeruimd.</p>
    </header>

    <div class="header-rule" aria-hidden="true"></div>

    <div class="game-shell">
      <div class="game-shell-header">
        <button class="fullscreen-btn" id="fullscreenBtn" type="button" aria-label="Volledig scherm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
      </div>
      <div class="game-stage" id="game-stage">
        <div id="modal_parent">
          <div id="modal_content"><span id="modal_close_button">&times;</span>
            <div id="store_link_modal_content" class="modal_inner"></div>
            <div id="share_file_modal_content" class="modal_inner"></div>
          </div>
        </div>
        <div id="canvas_border" class="emscripten_border">
          <div id="play_content" class="middle center">
            <img src="webapp/cover.jpg" class="cover" alt="Stacktris">
            <p class="game-name">Stacktris</p>
            <p class="game-author">Fancade</p>
            <div id="progress_or_play"><progress id="progress" class="loading" value="0" max="100"></progress></div>
            <button id="playBtn" style="display:none; padding: 0.75rem 1.5rem; border-radius: 8px; border: 1px solid var(--line); background: rgba(9, 13, 38, 0.72); color: #fff; font-size: 1rem; cursor: pointer; pointer-events: auto;">Start Spel</button>
          </div>
          <canvas class="emscripten" id="canvas" tabindex="-1"></canvas>
          <div id="gradient"></div>
          <div id="webview_content"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Stars canvas must stay AFTER the game canvas: the engine resolves
       mouse input via document.querySelector('canvas'), which returns the
       first canvas in DOM order. -->
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

<script type="text/javascript" src="webapp/poki-stub.js"></script>
<script type="text/javascript" src="webapp/source_min.js" crossorigin="anonymous"></script>
<script>
// Unity/SDL expects Module.canvas to point at the game canvas for mouse/touch input
if (window.Module) {
  Module.canvas = document.getElementById('canvas');
}

// Show play button when loading completes
const progress = document.getElementById('progress');
const playBtn = document.getElementById('playBtn');
const playContent = document.getElementById('play_content');

if (progress && playBtn && playContent) {
  const observer = new MutationObserver(() => {
    if (progress.value >= 100) {
      progress.style.display = 'none';
      playBtn.style.display = 'block';
    }
  });
  observer.observe(progress, { attributes: true, attributeFilter: ['value'] });

  playBtn.addEventListener('click', () => {
    playContent.style.display = 'none';
  });
}
</script>
<script type="text/javascript" src="webapp/index.js" crossorigin="anonymous"></script>
<script>
// Fullscreen toggle (same behavior as snake page)
const fullscreenBtn = document.getElementById('fullscreenBtn');
if (fullscreenBtn) {
  fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => console.log('Fullscreen error:', err));
    } else {
      document.exitFullscreen();
    }
  });
}

// Dynamically adjust aspect ratio based on canvas dimensions
const gameStage = document.getElementById('game-stage');
const canvas = document.getElementById('canvas');

function updateAspectRatio() {
  if (canvas && gameStage) {
    const width = canvas.width;
    const height = canvas.height;
    if (width > 0 && height > 0) {
      const ratio = width / height;
      gameStage.style.aspectRatio = `${width} / ${height}`;
    }
  }
}

// Monitor canvas size changes
if (canvas && gameStage) {
  const observer = new MutationObserver(updateAspectRatio);
  observer.observe(canvas, { attributes: true, attributeFilter: ['width', 'height'] });

  // Also check periodically during loading
  let checkInterval = setInterval(() => {
    updateAspectRatio();
    // Stop checking once game appears to be loaded
    if (canvas.width > 0 && canvas.height > 0) {
      clearInterval(checkInterval);
    }
  }, 500);

  // Final check after a longer delay
  setTimeout(() => {
    clearInterval(checkInterval);
    updateAspectRatio();
  }, 5000);
}

// Keep canvas sized to the stage when the window resizes
window.addEventListener('load', () => {
  const stage = document.getElementById('game-stage');
  if (stage && 'ResizeObserver' in window) {
    new ResizeObserver(() => window.dispatchEvent(new Event('resize'))).observe(stage);
  }
});
// Register the site service worker so this game works offline
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
<script src="/js/starfield.js" defer></script>
<script src="/js/ui-settings.js"></script>
</body>
</html>
